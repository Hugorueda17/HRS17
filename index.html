function hdayHtml(day){
  return (
    '<div class="hday">' +
      '<div class="hday-top">' +
        '<span class="hday-date">' + shortDate(day.date) + '</span>' +
        '<span class="hday-routine">' + esc(day.routine) + '</span>' +
      '</div>' +
      '<div class="hday-sets">' + day.sets.map(s =>
        '<span class="hset">' +
          (day.type === "time"
            ? esc(setDesc(s, "time"))
            : (s.weight === null ? "—" : fmtNum(s.weight) + " kg") + ' × ' + (s.reps || "—")) +
          (s.rir === null || s.rir === undefined ? "" : ' <span style="opacity:.6">RIR ' + s.rir + '</span>') +
        '</span>').join("") + '</div>' +
      (day.notes && day.notes.trim()
        ? '<div class="hnote-text">' + esc(day.notes) + '</div>'
        : '') +
    '</div>'
  );
}

/* Agrupa una lista ya ordenada (de mas nueva a mas antigua) por meses. */
function byMonth(list, dateOf){
  const out = [];
  let cur = null;
  list.forEach(x => {
    const d = new Date(dateOf(x));
    const k = d.getFullYear() + "-" + d.getMonth();
    if (!cur || cur.k !== k){ cur = { k: k, y: d.getFullYear(), m: d.getMonth(), items: [] }; out.push(cur); }
    cur.items.push(x);
  });
  return out;
}
function monthTitle(g){ return MONTHS[g.m].charAt(0).toUpperCase() + MONTHS[g.m].slice(1) + ' ' + g.y; }

function workoutRow(s){
  const st = sessionVolume(s);
  const d = new Date(s.startedAt);
  const dias = ["dom","lun","mar","mié","jue","vie","sáb"];
  return '<button class="row" data-opensession="' + s.id + '">' +
    '<span class="row-main">' +
      '<span class="row-title">' + esc(s.routineNameSnapshot) +
        (s.notes && s.notes.trim() ? '<span class="badge">Nota</span>' : '') + '</span>' +
      '<span class="row-sub num">' + dias[d.getDay()] + ' ' + shortDate(s.startedAt) + ' · ' +
        fmtDur(s.durationSeconds) + ' · ' + st.sets + (st.sets === 1 ? ' serie' : ' series') + '</span>' +
    '</span>' +
    '<span class="row-chevron">' + ICONS.chevron + '</span>' +
  '</button>';
}

function trainHistoryHtml(){
  const all = Sessions.byDateDesc();
  if (!all.length) return '';
  let h = '<div class="sec-label">Últimos entrenamientos</div>' +
    '<div class="list">' + all.slice(0, 5).map(workoutRow).join("") + '</div>';
  if (all.length > 5){
    h += '<button class="linkbtn" data-openhist="train">Ver historial completo (' + all.length + ')</button>';
  }
  return h;
}

function renderTrainAll(){
  const all = Sessions.byDateDesc();
  if (!all.length) return '<div class="empty" style="margin:48px 32px">Aún no hay entrenamientos.</div>';
  return '<div style="padding-bottom:28px">' + byMonth(all, x => x.startedAt).map(g =>
    '<div class="sec-label">' + monthTitle(g) + ' · ' + g.items.length +
      (g.items.length === 1 ? ' entrenamiento' : ' entrenamientos') + '</div>' +
    '<div class="list">' + g.items.map(workoutRow).join("") + '</div>'
  ).join("") + '</div>';
}

function renderStudyAll(){
  const all = Study.byDateDesc();
  if (!all.length) return '<div class="empty" style="margin:48px 32px">Aún no hay sesiones de estudio.</div>';
  return '<div style="padding-bottom:28px">' + byMonth(all, x => x.startedAt).map(g =>
    '<div class="sec-label">' + monthTitle(g) + ' · ' +
      fmtHM(g.items.reduce((n,x) => n + (x.durationSeconds || 0), 0)) + '</div>' +
    '<div class="list">' + g.items.map(studyRow).join("") + '</div>'
  ).join("") + '</div>';
}

function renderExerciseHistory(){
  const ex = Exercises.byId(ui.exerciseId);
  if (!ex) return "";
  const history = exerciseHistory(ex.id);
  return '<div class="detail">' +
    '<div class="dstats">' + history.length + (history.length === 1 ? ' entrenamiento' : ' entrenamientos') + '</div>' +
    byMonth(history, x => x.date).map(g =>
      '<div class="sec-label" style="margin:22px 2px 10px">' + monthTitle(g) + '</div>' +
      g.items.map(hdayHtml).join("")
    ).join("") + '</div>';
}

/* ============================================================
   7. RENDER PRINCIPAL
   ============================================================ */

function render(){
  const view = document.getElementById("view");
  const back = document.getElementById("btn-back");
  const save = document.getElementById("btn-save");
  const settings = document.getElementById("btn-settings");
  const chrono = document.getElementById("chrono");
  const note = document.getElementById("btn-note");
  const tabbar = document.getElementById("tabbar");
  const title = document.getElementById("title");

  back.hidden = true; save.hidden = true; settings.hidden = false;
  chrono.hidden = true; note.hidden = true; tabbar.hidden = false;
  settings.classList.toggle("warn", backupStatus().warn);
  save.textContent = "Guardar";

  /* El editor de rutinas ocupa toda la pantalla: sin pestanas, con volver y guardar. */
  if (ui.screen === "routineEditor"){
    title.textContent = ui.draft.id ? "Editar rutina" : "Nueva rutina";
    back.hidden = false;
    save.hidden = false;
    settings.hidden = true;
    tabbar.hidden = true;
    view.innerHTML = renderRoutineEditor();
    wireEditor();
    return;
  }

  /* Sesion activa: cronometro y notas en la cabecera, sin pestanas. */
  if (ui.screen === "session"){
    const a = Active.get();
    if (!a){ ui.screen = null; render(); return; }
    title.textContent = a.routineNameSnapshot;
    title.style.fontSize = "18px";
    back.hidden = false;
    settings.hidden = true;
    chrono.hidden = false;
    note.hidden = false;
    note.classList.toggle("has", !!(a.notes && a.notes.trim()));
    tabbar.hidden = true;
    view.innerHTML = renderSession();
    startTicker();
    requestWake();
    return;
  }

  /* Ajustes */
  if (ui.screen === "settings"){
    title.textContent = "Ajustes";
    title.style.fontSize = "";
    back.hidden = false;
    settings.hidden = true;
    tabbar.hidden = true;
    view.innerHTML = renderSettings();
    return;
  }

  /* Detalle de un ejercicio */
  if (ui.screen === "exercise"){
    const ex = Exercises.byId(ui.exerciseId);
    if (!ex){ ui.screen = null; render(); return; }
    title.textContent = ex.name;
    title.style.fontSize = "18px";
    back.hidden = false;
    save.hidden = false;
    save.disabled = false;
    save.textContent = "Editar";
    settings.hidden = true;
    tabbar.hidden = true;
    view.innerHTML = renderExerciseDetail();
    return;
  }

  /* Historiales completos */
  if (ui.screen === "trainAll" || ui.screen === "studyAll" || ui.screen === "exerciseHistory"){
    const ex = ui.screen === "exerciseHistory" ? Exercises.byId(ui.exerciseId) : null;
    title.textContent = ui.screen === "trainAll" ? "Historial de entrenos"
      : ui.screen === "studyAll" ? "Historial de estudio"
      : (ex ? ex.name : "Historial");
    title.style.fontSize = "18px";
    back.hidden = false;
    settings.hidden = true;
    tabbar.hidden = true;
    view.innerHTML = ui.screen === "trainAll" ? renderTrainAll()
      : ui.screen === "studyAll" ? renderStudyAll()
      : renderExerciseHistory();
    return;
  }

  /* Una sesion de estudio guardada */
  if (ui.screen === "studyView"){
    const x = Study.byId(ui.studyId);
    title.textContent = x ? dayLabel(x.startedAt).replace(/ de \d{4}$/, "") : "Estudio";
    title.style.fontSize = "18px";
    back.hidden = false;
    settings.hidden = true;
    tabbar.hidden = true;
    view.innerHTML = renderStudyView();
    return;
  }

  /* Cierre de una sesion de estudio */
  if (ui.screen === "studyFinish"){
    title.textContent = "Estudio guardado";
    title.style.fontSize = "20px";
    settings.hidden = true;
    tabbar.hidden = true;
    view.innerHTML = renderStudyFinish();
    const ta = document.getElementById("sf-note");
    if (ta) setTimeout(() => ta.focus(), 120);
    return;
  }

  /* Un dia del historial */
  if (ui.screen === "day"){
    const one = Store.data.sessions.find(x => x.id === ui.sessionId);
    title.textContent = one
      ? dayLabel(one.startedAt).replace(/ de \d{4}$/, "")
      : "Entrenamiento";
    title.style.fontSize = "18px";
    back.hidden = false;
    settings.hidden = true;
    tabbar.hidden = true;
    view.innerHTML = renderDay();
    return;
  }

  /* Corregir un entrenamiento pasado */
  if (ui.screen === "sessionEdit"){
    title.textContent = "Editar entrenamiento";
    title.style.fontSize = "18px";
    back.hidden = false;
    save.hidden = false;
    save.disabled = false;
    settings.hidden = true;
    tabbar.hidden = true;
    view.innerHTML = renderSessionEdit();
    return;
  }

  /* Pantalla de cierre: sin salidas laterales, se sale por los botones. */
  if (ui.screen === "finish"){
    title.textContent = "Entrenamiento guardado";
    title.style.fontSize = "20px";
    settings.hidden = true;
    tabbar.hidden = true;
    view.innerHTML = renderFinish();
    const ta = document.getElementById("f-note");
    if (ta) setTimeout(() => ta.focus(), 120);
    return;
  }

  title.style.fontSize = "";
  const tab = TABS.find(t => t.id === ui.tab);
  title.textContent = tab.label;

  if (ui.tab === "exercises")      view.innerHTML = renderExercises();
  else if (ui.tab === "routines")  view.innerHTML = renderRoutines();
  else if (ui.tab === "train")     view.innerHTML = renderTrain();
  else if (ui.tab === "study")     view.innerHTML = renderStudy();
  else                             view.innerHTML = renderCalendar();

  if (Active.get() || Study.active()) startTicker();
  renderTabs();
}

/* ============================================================
   8. EVENTOS
   ============================================================ */

document.getElementById("tabbar").addEventListener("click", ev => {
  const btn = ev.target.closest("[data-tab]");
  if (btn) goTab(btn.dataset.tab);
});

document.getElementById("view").addEventListener("click", async ev => {
  /* --- Sesion activa --- */
  if (ui.screen === "session"){
    const a = Active.get();
    const sw = ev.target.closest("[data-sw]");
    if (sw){ toggleStopwatch(sw); return; }

    const copy = ev.target.closest("[data-copy]");
    if (copy){
      const ref = currentSet(copy);
      const row = copy.closest(".set");
      const seen = {};
      let occurrence = 0;
      a.exercises.forEach((b,i) => {
        if (i < +row.dataset.b && b.exerciseId === ref.block.exerciseId) occurrence++;
      });
      const last = Sessions.lastTime(ref.block.exerciseId, occurrence);
      const prev = last && last.sets[+row.dataset.s];
      if (!prev) return;
      ref.set.weight = prev.weight;
      row.querySelector('[data-f="weight"]').value = fmtNum(prev.weight);
      if (blockType(ref.block) === "time"){
        if (ref.set.timerStartedAt) return;
        ref.set.durationSeconds = prev.durationSeconds === undefined ? null : prev.durationSeconds;
        row.querySelector('[data-f="time"]').value = fmtClock(prev.durationSeconds);
      } else {
        ref.set.reps = prev.reps;
        row.querySelector('[data-f="reps"]').value = prev.reps === null ? "" : prev.reps;
      }
      row.classList.toggle("filled", hasData(ref.set));
      saveNow();
      return;
    }

    const menu = ev.target.closest("[data-menu]");
    if (menu){ openSessionExerciseMenu(+menu.dataset.menu); return; }

    const addset = ev.target.closest("[data-addset]");
    if (addset){
      a.exercises[+addset.dataset.addset].sets.push(Active.emptySet());
      saveNow();
      render();
      return;
    }

    if (ev.target.closest("#add-sess-ex")){
      openExercisePicker({
        already: id => a.exercises.filter(b => b.exerciseId === id).length,
        onAdd: ids => {
          ids.forEach(id => {
            const ex = Exercises.byId(id);
            if (!ex) return;
            const b = Active.blockFrom(ex);
            b.sets.push(Active.emptySet());
            b.sets.push(Active.emptySet());
            b.sets.push(Active.emptySet());
            a.exercises.push(b);
          });
          saveNow();
        }
      });
      return;
    }

    if (ev.target.closest("#finish")){ tryFinish(); return; }
    if (ev.target.closest("#discard")){ doDiscard(); return; }
    return;
  }

  /* --- Historiales completos --- */
  if (ui.screen === "trainAll"){
    const o = ev.target.closest("[data-opensession]");
    if (o){
      ui.returnTo = "trainAll";
      ui.sessionId = o.dataset.opensession;
      ui.screen = "day";
      render();
      document.getElementById("view").scrollTop = 0;
    }
    return;
  }
  if (ui.screen === "studyAll"){
    const o = ev.target.closest("[data-study]");
    if (o){
      ui.returnTo = "studyAll";
      ui.studyId = o.dataset.study;
      ui.screen = "studyView";
      render();
      document.getElementById("view").scrollTop = 0;
    }
    return;
  }
  if (ui.screen === "exerciseHistory") return;

  /* --- Una sesion de estudio guardada --- */
  if (ui.screen === "studyView"){
    if (ev.target.closest("#sv-edit")){ openStudyForm(ui.studyId); return; }
    if (ev.target.closest("#sv-delete")){
      const ok = await confirmAction({
        title: "¿Borrar esta sesión de estudio?",
        message: "Se pierde su tiempo y su nota. No se puede deshacer.",
        okText: "Borrar",
        danger: true
      });
      if (!ok) return;
      Study.remove(ui.studyId);
      ui.screen = ui.returnTo || null; ui.returnTo = null; ui.studyId = null;
      toast("Sesión borrada");
      render();
    }
    return;
  }

  /* --- Cierre de una sesion de estudio --- */
  if (ui.screen === "studyFinish"){
    const r = ev.target.closest("[data-rate]");
    if (r){
      /* sin repintar, para no perder lo que llevas escrito */
      ui.studyRate = ui.studyRate === r.dataset.rate ? null : r.dataset.rate;
      document.querySelectorAll("[data-rate]").forEach(y => y.setAttribute("aria-pressed", y.dataset.rate === ui.studyRate));
      return;
    }
    if (ev.target.closest("#sf-save")){ closeStudyFinish(true); return; }
    if (ev.target.closest("#sf-skip")){ closeStudyFinish(false); return; }
    return;
  }

  /* --- Pantalla de cierre --- */
  if (ui.screen === "finish"){
    if (ev.target.closest("#f-note-save")){ closeFinish(true); return; }
    if (ev.target.closest("#f-note-skip")){ closeFinish(false); return; }
    return;
  }

  /* --- Ajustes --- */
  if (ui.screen === "settings"){
    if (ev.target.closest("#s-export")){ exportData(); return; }
    if (ev.target.closest("#s-import")){ document.getElementById("s-file").click(); return; }
    if (ev.target.closest("#s-addmuscle")){ openMuscleAdd(); return; }
    const me = ev.target.closest("[data-muscleedit]");
    if (me){ openMuscleEditor(me.dataset.muscleedit); return; }
    return;
  }

  /* --- Detalle de ejercicio --- */
  if (ui.screen === "exercise"){
    const serie = ev.target.closest("[data-serie]");
    if (serie){ ui.setIndex = +serie.dataset.serie; render(); return; }
    const met = ev.target.closest("[data-metric]");
    if (met){ ui.metric = met.dataset.metric; render(); return; }
    if (ev.target.closest('[data-openhist="exercise"]')){
      ui.screen = "exerciseHistory";
      render();
      document.getElementById("view").scrollTop = 0;
      return;
    }
    return;
  }

  /* --- Editar un entrenamiento pasado --- */
  if (ui.screen === "sessionEdit"){
    const menu = ev.target.closest("[data-menu]");
    if (menu){ openSessionExerciseMenu(+menu.dataset.menu); return; }

    const addset = ev.target.closest("[data-addset]");
    if (addset){
      ui.editDraft.notes = (document.getElementById("se-note") || {}).value || ui.editDraft.notes;
      ui.editDraft.exercises[+addset.dataset.addset].sets.push({ weight:null, reps:null, rir:null, completed:true });
      render();
      return;
    }

    if (ev.target.closest("#add-sess-ex")){
      ui.editDraft.notes = (document.getElementById("se-note") || {}).value || ui.editDraft.notes;
      openExercisePicker({
        already: id => ui.editDraft.exercises.filter(b => b.exerciseId === id).length,
        onAdd: ids => ids.forEach(id => {
          const ex = Exercises.byId(id);
          if (!ex) return;
          const blk = Active.blockFrom(ex);
          blk.sets.push(Active.emptySet());
          ui.editDraft.exercises.push(blk);
        })
      });
      return;
    }
    return;
  }

  /* --- Un dia del historial --- */
  if (ui.screen === "day"){
    const note = ev.target.closest("[data-note]");
    if (note){ openNoteEditor(note.dataset.note); return; }

    const edit = ev.target.closest("[data-edit]");
    if (edit){ openSessionEditor(edit.dataset.edit); return; }

    const del = ev.target.closest("[data-delsession]");
    if (del){
      const ok = await confirmAction({
        title: "¿Borrar este entrenamiento?",
        message: "Se pierde el registro completo de esa sesión, con sus series y su nota. No se puede deshacer.",
        okText: "Borrar",
        danger: true
      });
      if (!ok) return;
      Store.data.sessions = Store.data.sessions.filter(x => x.id !== del.dataset.delsession);
      Store.save();
      toast("Entrenamiento borrado");
      ui.screen = ui.returnTo || null; ui.returnTo = null; ui.sessionId = null;
      render();
      return;
    }
    return;
  }

  /* --- Editor de rutinas --- */
  if (ui.screen === "routineEditor"){
    const del = ev.target.closest("[data-del]");
    if (del){
      const it = itemByKey(del.dataset.del);
      ui.draft.items = ui.draft.items.filter(i => i.key !== del.dataset.del);
      render();
      if (it) toast("Ejercicio quitado de la rutina");
      return;
    }
    const dec = ev.target.closest("[data-dec]");
    if (dec){
      const it = itemByKey(dec.dataset.dec);
      if (it && it.targetSets > 1){ it.targetSets--; render(); }
      return;
    }
    const inc = ev.target.closest("[data-inc]");
    if (inc){
      const it = itemByKey(inc.dataset.inc);
      if (it && it.targetSets < 20){ it.targetSets++; render(); }
      return;
    }
    if (ev.target.closest("#add-ex")){
      openExercisePicker({
        already: id => ui.draft.items.filter(i => i.exerciseId === id).length,
        onAdd: ids => ids.forEach(id => ui.draft.items.push({ key:uid(), exerciseId:id, targetSets:3 }))
      });
      return;
    }

    if (ev.target.closest("#r-dup")){
      const ok = await confirmAction({
        title: "¿Duplicar la rutina?",
        message: "Se guardan primero los cambios de esta rutina y se crea una copia con el mismo contenido, que podrás editar por separado.",
        okText: "Duplicar"
      });
      if (!ok) return;
      if (draftDirty() && !saveRoutine()) return;
      const copy = Routines.duplicate(ui.draft.id);
      if (copy){ toast("Rutina duplicada"); openRoutineEditor(copy.id); }
      return;
    }

    if (ev.target.closest("#r-archive")){
      const r = Routines.byId(ui.draft.id);
      const ok = await confirmAction({
        title: "¿Archivar " + (r ? r.name : "la rutina") + "?",
        message: "Dejará de aparecer al elegir entrenamiento, pero las sesiones que ya hiciste con ella no cambian. Puedes restaurarla cuando quieras.",
        okText: "Archivar",
        danger: true
      });
      if (!ok) return;
      Routines.setArchived(ui.draft.id, true);
      ui.screen = null; ui.draft = null; ui.draftBase = null;
      toast("Rutina archivada");
      render();
      return;
    }

    if (ev.target.closest("#r-delete")){
      const r = Routines.byId(ui.draft.id);
      const ok = await confirmAction({
        title: "¿Borrar " + (r ? r.name : "la rutina") + "?",
        message: "Se borra para siempre y no se puede deshacer. Los entrenamientos que ya hayas hecho con ella se conservan tal cual.",
        okText: "Borrar",
        danger: true
      });
      if (!ok) return;
      Routines.remove(ui.draft.id);
      ui.screen = null; ui.draft = null; ui.draftBase = null;
      toast("Rutina borrada");
      render();
      return;
    }

    if (ev.target.closest("#r-restore")){
      Routines.setArchived(ui.draft.id, false);
      ui.screen = null; ui.draft = null; ui.draftBase = null;
      ui.showArchived = false;
      toast("Rutina restaurada");
      render();
      return;
    }
    return;
  }

  /* --- Estudio --- */
  if (ev.target.closest("#study-start")){
    if (Study.start()){ startTicker(); render(); }
    return;
  }
  if (ev.target.closest("#study-pause")){ Study.pause(); render(); return; }
  if (ev.target.closest("#study-resume")){ Study.resume(); render(); return; }
  if (ev.target.closest("#study-finish")){ tryStudyFinish(); return; }
  if (ev.target.closest("#study-discard")){
    const ok = await confirmAction({
      title: "¿Descartar la sesión?",
      message: "Se pierde el tiempo que llevas de esta sesión de estudio.",
      okText: "Descartar",
      danger: true
    });
    if (!ok) return;
    Study.discard();
    toast("Sesión descartada");
    render();
    return;
  }
  const sr = ev.target.closest("[data-study]");
  if (sr){
    ui.returnTo = null;
    ui.studyId = sr.dataset.study;
    ui.screen = "studyView";
    render();
    document.getElementById("view").scrollTop = 0;
    return;
  }
  const oh = ev.target.closest("[data-openhist]");
  if (oh){
    ui.screen = oh.dataset.openhist === "study" ? "studyAll" : "trainAll";
    render();
    document.getElementById("view").scrollTop = 0;
    return;
  }
  if (ev.target.closest("#study-add")){ openStudyForm(null); return; }
  const sad = ev.target.closest("[data-studyadd]");
  if (sad){ openStudyForm(null, sad.dataset.studyadd); return; }

  /* --- Pestanas normales --- */
  const chip = ev.target.closest("[data-muscle]");
  if (chip){
    ui.muscle = chip.dataset.muscle || null;
    render();
    return;
  }
  const arch = ev.target.closest("[data-archived]");
  if (arch){
    ui.showArchived = arch.dataset.archived === "1";
    ui.muscle = null;
    render();
    document.getElementById("view").scrollTop = 0;
    return;
  }
  const row = ev.target.closest("[data-ex]");
  if (row){
    ui.exerciseId = row.dataset.ex;
    ui.setIndex = 0;
    ui.metric = "time";
    ui.screen = "exercise";
    render();
    document.getElementById("view").scrollTop = 0;
    return;
  }

  const rrow = ev.target.closest("[data-routine]");
  if (rrow){ openRoutineEditor(rrow.dataset.routine); return; }

  const month = ev.target.closest("[data-month]");
  if (month){
    const delta = +month.dataset.month;
    let m = ui.month.m + delta, y = ui.month.y;
    if (m < 0){ m = 11; y--; }
    if (m > 11){ m = 0; y++; }
    ui.month = { y, m };
    ui.selectedDay = null;
    render();
    return;
  }

  const day = ev.target.closest("[data-day]");
  if (day){
    ui.selectedDay = day.dataset.day;
    render();
    return;
  }

  const opensession = ev.target.closest("[data-opensession]");
  if (opensession){
    ui.returnTo = null;
    ui.sessionId = opensession.dataset.opensession;
    ui.screen = "day";
    render();
    document.getElementById("view").scrollTop = 0;
    return;
  }

  const start = ev.target.closest("[data-start]");
  if (start){
    const r = Routines.byId(start.dataset.start);
    if (r) openStartSheet(r);
    return;
  }

  if (ev.target.closest("#start-free")){
    const ok = await confirmAction({
      title: "¿Empezar un entrenamiento libre?",
      message: "Arranca sin rutina y vas añadiendo los ejercicios sobre la marcha.",
      okText: "Empezar"
    });
    if (!ok) return;
    Active.start(null);
    ui.screen = "session";
    render();
    return;
  }

  if (ev.target.closest("#resume")){
    ui.screen = "session";
    render();
    return;
  }

  if (ev.target.closest("#fab")){
    if (ui.tab === "routines") openRoutineEditor(null);
    else openExerciseForm(null);
  }
});

/* El buscador filtra sin volver a pintar toda la vista, para no perder el foco. */
document.getElementById("view").addEventListener("input", ev => {
  if (ui.screen === "session" || ui.screen === "sessionEdit"){
    const field = ev.target.dataset ? ev.target.dataset.f : null;
    if (!field) return;
    const ref = currentSet(ev.target);
    if (!ref) return;
    if (field === "weight") ref.set.weight = parseNum(ev.target.value);
    else if (field === "time"){
      const shown = clockTyping(ev.target.value);
      ev.target.value = shown;
      ref.set.durationSeconds = clockSeconds(shown);
    }
    else ref.set[field] = parseWhole(ev.target.value);
    ref.row.classList.toggle("filled", hasData(ref.set));
    if (ui.screen === "session") saveSoon();
    return;
  }
  if (ev.target.id !== "search") return;
  ui.search = ev.target.value;
  const view = document.getElementById("view");
  const scroll = view.scrollTop;
  const el = ev.target;
  const pos = el.selectionStart;
  view.innerHTML = renderExercises();
  const again = document.getElementById("search");
  if (again){
    again.focus();
    try { again.setSelectionRange(pos, pos); } catch(e){}
  }
  view.scrollTop = scroll;
});

document.getElementById("btn-back").addEventListener("click", () => {
  if (ui.screen === "routineEditor"){ closeRoutineEditor(); return; }
  if (ui.screen === "settings"){
    ui.screen = null;
    render();
    return;
  }
  if (ui.screen === "exercise"){
    ui.screen = null; ui.exerciseId = null;
    render();
    return;
  }
  if (ui.screen === "studyView"){
    ui.screen = ui.returnTo || null; ui.returnTo = null; ui.studyId = null;
    render();
    return;
  }
  if (ui.screen === "trainAll" || ui.screen === "studyAll"){
    ui.screen = null;
    render();
    return;
  }
  if (ui.screen === "exerciseHistory"){
    ui.screen = "exercise";
    render();
    return;
  }
  if (ui.screen === "day"){
    ui.screen = ui.returnTo || null; ui.returnTo = null; ui.sessionId = null;
    render();
    return;
  }
  if (ui.screen === "sessionEdit"){
    ui.screen = "day"; ui.editId = null; ui.editDraft = null;
    render();
    return;
  }
  if (ui.screen === "session"){
    /* La sesion sigue viva: se vuelve a Entrenar y alli esta Continuar. */
    saveNow();
    releaseWake();
    ui.screen = null;
    ui.tab = "train";
    render();
  }
});

document.getElementById("btn-note").addEventListener("click", openSessionNotes);

/* Peso negativo (maquinas asistidas): el teclado decimal de iOS no trae
   el signo menos, asi que se cambia manteniendo pulsado el campo de peso. */
document.getElementById("view").addEventListener("pointerdown", ev => {
  if (ui.screen !== "session" && ui.screen !== "sessionEdit") return;
  const input = ev.target.closest('[data-f="weight"]');
  if (!input) return;
  const timer = setTimeout(() => {
    const ref = currentSet(input);
    if (!ref) return;
    const v = parseNum(input.value);
    if (v === null || v === 0) return;
    ref.set.weight = -v;
    input.value = fmtNum(-v);
    persistEdits();
    toast(-v < 0 ? "Peso negativo: máquina asistida" : "Peso positivo");
  }, 600);
  const cancel = () => {
    clearTimeout(timer);
    input.removeEventListener("pointerup", cancel);
    input.removeEventListener("pointercancel", cancel);
    input.removeEventListener("pointermove", cancel);
  };
  input.addEventListener("pointerup", cancel);
  input.addEventListener("pointercancel", cancel);
  input.addEventListener("pointermove", cancel);
});

/* Nada se pierde si el movil se bloquea, entra una llamada o se cierra la app. */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden"){ saveNow(); releaseWake(); }
  else if (ui.screen === "session"){ requestWake(); tick(); }
});
window.addEventListener("pagehide", saveNow);

document.getElementById("btn-save").addEventListener("click", () => {
  if (ui.screen === "exercise"){ openExerciseForm(ui.exerciseId); return; }
  if (ui.screen === "sessionEdit"){
    if (!saveSessionEdit()) return;
    ui.screen = "day"; ui.editId = null; ui.editDraft = null;
    toast("Entrenamiento actualizado");
    render();
    return;
  }
  if (ui.screen !== "routineEditor") return;
  if (!saveRoutine()) return;
  ui.screen = null; ui.draft = null; ui.draftBase = null;
  toast("Rutina guardada");
  render();
});

document.getElementById("btn-settings").addEventListener("click", () => {
  ui.screen = "settings";
  render();
  document.getElementById("view").scrollTop = 0;
});

document.getElementById("view").addEventListener("change", ev => {
  if (ev.target.id !== "s-file") return;
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed = null;
    try { parsed = JSON.parse(reader.result); } catch(e){ parsed = null; }
    if (!validImport(parsed)){
      toast("Ese archivo no es una copia válida");
      return;
    }
    askImportMode(parsed);
  };
  reader.onerror = () => toast("No se ha podido leer el archivo");
  reader.readAsText(file);
});

/* Cerrar la hoja con el gesto de atras del navegador */
window.addEventListener("popstate", () => { if (document.querySelector(".overlay")) closeSheet(); });

/* ============================================================
   9. ARRANQUE
   ============================================================ */

/* El service worker solo existe cuando la app esta servida por https
   desde su propia carpeta. Si no esta, la app funciona igual. */
if ("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

Store.load();
render();
if (Study.active()) startTicker();
if (Store.broken) toast("No se han podido leer los datos guardados");
if (Active.get()) startTicker();
</script>
