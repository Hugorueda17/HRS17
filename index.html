<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HRS17">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>HRS17</title>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#000000;
  --surface:#121214;
  --surface-2:#1C1C1F;
  --border:#2A2A2D;
  --text:#FFFFFF;
  --muted:#8A8A8E;
  --accent:#5AA0FF;        /* azul claro: texto, iconos y foco sobre negro */
  --accent-solid:#0A63E8;  /* azul profundo: botones rellenos con texto blanco */
  --on-accent:#FFFFFF;
  --green:#32D74B;         /* series completadas y records */
  --danger:#FF453A;        /* acciones destructivas */
  --r:14px;
  --tap:44px;
  --kb:0px;                /* alto del teclado, lo actualiza visualViewport */
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}

/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{
  margin:0;
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  font-size:17px;
  line-height:1.35;
  overscroll-behavior:none;
  touch-action:manipulation;
}
button,input,select,textarea{
  font-family:inherit;
  font-size:16px;              /* minimo 16px: evita el zoom de Safari */
  color:inherit;
}
button{background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{-webkit-appearance:none;appearance:none}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ============================================================
   ESTRUCTURA: cabecera fija + vista scrollable + barra inferior
   ============================================================ */
.header{
  flex:0 0 auto;
  padding:var(--safe-t) 16px 0;
  background:var(--bg);
  border-bottom:1px solid var(--border);
}
.header-row{
  height:52px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.header h1{
  margin:0;
  min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:24px;
  font-weight:700;
  letter-spacing:-.02em;
}
.icon-btn{
  width:var(--tap);height:var(--tap);
  margin-right:-10px;
  display:grid;place-items:center;
  color:var(--muted);
}
.icon-btn:active{color:var(--text)}

.view{
  flex:1 1 auto;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding-bottom:24px;
}

.tabbar{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  background:var(--bg);
  border-top:1px solid var(--border);
  padding-bottom:var(--safe-b);
}
.tab{
  min-height:var(--tap);
  padding:8px 0 6px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.01em;
}
.tab svg{width:24px;height:24px;stroke-width:1.9}
.tab[aria-current="page"]{color:var(--accent)}

/* ============================================================
   BUSCADOR Y FILTROS
   ============================================================ */
.toolbar{
  position:sticky;top:0;z-index:5;
  background:var(--bg);
  padding:10px 16px 8px;
}
.search{
  width:100%;
  height:40px;
  padding:0 12px;
  border-radius:10px;
  background:var(--surface-2);
  border:1px solid transparent;
}
.search::placeholder{color:var(--muted)}
.search:focus{outline:none;border-color:var(--accent)}
.chips{
  display:flex;gap:8px;
  margin-top:10px;
  overflow-x:auto;
  scrollbar-width:none;
  padding-bottom:2px;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;
  height:32px;padding:0 14px;
  display:inline-flex;align-items:center;
  border-radius:16px;
  background:var(--surface-2);
  color:var(--muted);
  font-size:14px;
  white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--accent-solid);color:var(--on-accent);font-weight:600}

.count{
  padding:6px 16px 8px;
  color:var(--muted);
  font-size:13px;
}

/* ============================================================
   LISTA
   ============================================================ */
.list{
  margin:0 16px;
  border-radius:var(--r);
  background:var(--surface);
  overflow:hidden;
}
.row{
  width:100%;
  min-height:64px;
  padding:13px 14px;
  display:flex;align-items:center;gap:12px;
  text-align:left;
  border-bottom:1px solid var(--border);
}
.row:last-child{border-bottom:0}
.row:active{background:var(--surface-2)}
.row-main{flex:1 1 auto;min-width:0}
.row-title{
  display:block;
  font-size:17px;font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.row-sub{
  display:inline-block;
  margin-top:8px;
  padding:3px 9px;
  border-radius:7px;
  background:var(--surface-2);
  color:var(--muted);
  font-size:12.5px;
  letter-spacing:.01em;
}
.row-chevron{color:#48484A;flex:0 0 auto}
.badge{
  display:inline-block;
  margin-left:8px;padding:1px 6px;
  border-radius:5px;
  background:var(--surface-2);
  color:var(--muted);
  font-size:11px;font-weight:600;
  vertical-align:1px;
}
.dim .row-title{color:var(--muted)}

.empty{
  margin:48px 32px;
  text-align:center;
  color:var(--muted);
}
.empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.linkbtn{
  display:block;width:100%;
  min-height:var(--tap);
  margin-top:8px;
  color:var(--accent);
  font-size:15px;
}

/* ============================================================
   BOTON FLOTANTE
   ============================================================ */
.fab{
  position:fixed;right:16px;
  bottom:calc(var(--safe-b) + 74px);
  width:56px;height:56px;
  border-radius:28px;
  background:var(--accent-solid);
  color:var(--on-accent);
  display:grid;place-items:center;
  box-shadow:0 6px 20px rgba(0,0,0,.6);
  z-index:20;
}
.fab:active{transform:scale(.94)}
.fab svg{width:28px;height:28px;stroke-width:2.4}

/* ============================================================
   HOJA INFERIOR (formularios y confirmaciones)
   ============================================================ */
.overlay{
  position:fixed;inset:0;z-index:50;
  background:rgba(0,0,0,.6);
  display:flex;align-items:flex-end;
}
.sheet{
  width:100%;
  background:var(--surface);
  border-radius:18px 18px 0 0;
  padding:8px 16px calc(16px + var(--safe-b));
  margin-bottom:var(--kb);
  max-height:88vh;overflow-y:auto;
  animation:up .18s ease-out;
}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.grabber{width:36px;height:5px;border-radius:3px;background:#3A3A3D;margin:4px auto 14px}
.sheet h2{margin:0 0 16px;font-size:20px;font-weight:700;letter-spacing:-.01em}
.sheet p{margin:0 0 20px;color:var(--muted);font-size:15px;line-height:1.45}

.field{margin-bottom:16px}
.field label{display:block;margin-bottom:6px;color:var(--muted);font-size:13px}
.input,.select{
  width:100%;
  min-height:var(--tap);
  padding:10px 12px;
  border-radius:10px;
  background:var(--surface-2);
  border:1px solid transparent;
}
.input:focus,.select:focus{outline:none;border-color:var(--accent)}
.select{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%238A8A8E' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;
  background-position:right 12px center;
  padding-right:34px;
}
.btn{
  width:100%;
  min-height:50px;
  border-radius:12px;
  font-size:17px;font-weight:600;
  display:flex;align-items:center;justify-content:center;
}
.btn:active{opacity:.75}
.btn-primary{background:var(--accent-solid);color:var(--on-accent)}
.btn-ghost{background:var(--surface-2);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn-text{min-height:var(--tap);width:100%;color:var(--danger);font-size:15px;margin-top:4px}
.foot-note{margin-top:12px;color:var(--muted);font-size:13px;line-height:1.4;text-align:center}
.btn-row{display:flex;flex-direction:column;gap:10px}
.error{margin:-8px 0 14px;color:var(--danger);font-size:13px}

/* ============================================================
   AVISO BREVE
   ============================================================ */
.toast{
  position:fixed;left:16px;right:16px;
  bottom:calc(var(--safe-b) + 74px);
  z-index:60;
  padding:12px 16px;
  border-radius:12px;
  background:#2C2C2E;
  font-size:15px;text-align:center;
  animation:up .15s ease-out;
}

/* ============================================================
   RUTINAS: cabecera con accion, editor y selector
   ============================================================ */
[hidden]{display:none!important}
.backbtn{
  width:var(--tap);height:var(--tap);
  margin-left:-12px;
  display:grid;place-items:center;
  color:var(--accent);
}
.backbtn svg{width:22px;height:22px;stroke-width:2.2}
.hdr-action{
  min-height:var(--tap);padding:0 6px;margin-right:-6px;
  color:var(--accent);font-size:17px;font-weight:600;
}
.hdr-action:disabled{color:#48484A}

.editor{padding:16px 16px 40px}
.section-head{
  display:flex;align-items:baseline;justify-content:space-between;
  margin:24px 2px 10px;
  color:var(--muted);font-size:13px;
}
.rt-list{
  border-radius:var(--r);
  background:var(--surface);
  overflow:hidden;
}
.rt-row{
  height:96px;
  display:flex;align-items:center;
  padding-right:8px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  position:relative;
}
.rt-row:last-child{border-bottom:0}
.rt-row.dragging{
  z-index:3;
  background:var(--surface-2);
  box-shadow:0 10px 28px rgba(0,0,0,.65);
}
.rt-handle{
  flex:0 0 auto;
  width:var(--tap);height:96px;
  display:grid;place-items:center;
  color:#5A5A5E;
  touch-action:none;
}
.rt-handle svg{width:20px;height:20px;stroke-width:2}
.rt-body{flex:1 1 auto;min-width:0;display:block}
.rt-top{display:flex;align-items:center;gap:8px}
.rt-name{
  flex:1 1 auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:16px;font-weight:500;
}
.rt-del{
  flex:0 0 auto;
  width:var(--tap);height:40px;
  display:grid;place-items:center;
  color:#5A5A5E;
}
.rt-del svg{width:16px;height:16px;stroke-width:2.2}
.rt-bot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.rt-bot .row-sub{margin-top:0}
.stepper{
  flex:0 0 auto;
  display:flex;align-items:center;
  border-radius:10px;
  background:var(--surface-2);
}
.stepper button{
  width:var(--tap);height:var(--tap);
  display:grid;place-items:center;
  color:var(--accent);font-size:22px;line-height:1;
}
.stepper button:disabled{color:#48484A}
.stepper .val{min-width:62px;text-align:center;font-size:13px}

.add-ex{
  width:100%;min-height:50px;
  margin-top:12px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  border:1px dashed #3A3A3D;border-radius:12px;
  color:var(--accent);font-size:16px;
}
.add-ex svg{width:18px;height:18px;stroke-width:2.2}
.editor-foot{margin-top:32px;display:flex;flex-direction:column;gap:10px}

.preview{
  margin:14px -16px 0;
  max-height:38vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  border-top:1px solid var(--border);
}
.pv{
  display:flex;align-items:baseline;gap:10px;
  padding:11px 16px;
  border-bottom:1px solid var(--border);
}
.pv-n{width:16px;color:var(--muted);font-size:13px}
.pv-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.pv-sets{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.picker-list{
  margin:14px -16px 0;
  max-height:44vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  border-top:1px solid var(--border);
}
.pick{
  width:100%;min-height:56px;
  padding:10px 16px;
  display:flex;align-items:center;gap:12px;
  text-align:left;
  border-bottom:1px solid var(--border);
}
.pick:active{background:var(--surface-2)}
.pick-main{flex:1 1 auto;min-width:0}
.pick-name{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-sub{display:block;margin-top:3px;color:var(--muted);font-size:12.5px}
.check{
  flex:0 0 auto;
  width:24px;height:24px;
  border-radius:12px;
  border:1.5px solid #48484A;
  display:grid;place-items:center;
  color:transparent;
}
.check svg{width:14px;height:14px;stroke-width:3}
.pick[aria-pressed="true"] .check{background:var(--accent-solid);border-color:var(--accent-solid);color:#fff}

/* ============================================================
   SESION ACTIVA
   ============================================================ */
.chrono{
  margin-left:auto;padding:0 4px;
  color:var(--accent);font-size:17px;font-weight:600;
}
.notebtn{position:relative;margin-right:-6px}
.notebtn.has::after{
  content:"";position:absolute;top:9px;right:7px;
  width:9px;height:9px;border-radius:5px;
  background:var(--accent);
  border:2px solid var(--bg);
}

/* Elegir entrenamiento */
.cont{
  margin:16px;padding:18px;
  border-radius:18px;
  background:var(--surface);
  border:1px solid var(--border);
}
.cont-name{font-size:20px;font-weight:700;letter-spacing:-.01em}
.cont-meta{margin-top:6px;color:var(--muted);font-size:14px}
.cont-time{color:var(--accent);font-weight:600}
.cont .btn{margin-top:16px}
.sec-label{margin:22px 18px 8px;color:var(--muted);font-size:13px}

/* Bloque de ejercicio */
.sess{padding:12px 16px 40px}
.exblock{
  margin-bottom:18px;padding:12px 12px 4px;
  border-radius:var(--r);
  background:var(--surface);
}
.exhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.exhead-main{flex:1 1 auto;min-width:0}
.exname{
  display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:17px;font-weight:600;
}
.exmenu{
  flex:0 0 auto;
  width:var(--tap);height:var(--tap);margin:-6px -8px -6px 0;
  display:grid;place-items:center;color:var(--muted);
}
.exmenu svg{width:20px;height:20px}

.cols,.set{
  display:grid;
  grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 64px;
  gap:8px;align-items:center;
}
.cols{padding-bottom:4px;color:var(--muted);font-size:11px}
.cols span{text-align:center}
.cols span:first-child{text-align:left}
.set{padding:4px 0}
.set-n{color:var(--muted);font-size:13px}
.cell{
  width:100%;height:42px;padding:0 2px;
  border-radius:9px;
  background:var(--surface-2);
  border:1px solid transparent;
  text-align:center;
  font-variant-numeric:tabular-nums;
}
.cell:focus{outline:none;border-color:var(--accent)}
.cell::placeholder{color:#48484A}
.seg{display:flex;gap:6px;padding:4px;border-radius:12px;background:var(--surface-2)}
.seg button{flex:1 1 0;min-height:var(--tap);border-radius:9px;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-solid);color:#fff;font-weight:600}
.locked{
  padding:12px;border-radius:10px;background:var(--surface-2);
  font-size:15px;
}
.locked small{display:block;margin-top:6px;color:var(--muted);font-size:13px;line-height:1.4}
.cols.time,.set.time{grid-template-columns:26px minmax(0,1fr) minmax(0,1.15fr) 50px var(--tap)}
.sw{
  width:var(--tap);height:var(--tap);
  display:grid;place-items:center;
  border-radius:10px;
  background:var(--surface-2);
  color:var(--accent);
}
.sw svg{width:21px;height:21px;stroke-width:2}
.sw.on{background:var(--accent-solid);color:#fff}
.cell.running{color:var(--accent);border-color:var(--accent-solid)}
.set.filled .set-n{color:var(--green);font-weight:600}
.lastv{
  grid-column:2 / 5;justify-self:start;
  min-height:30px;padding:0 2px;
  color:var(--muted);font-size:12.5px;text-align:left;
  font-variant-numeric:tabular-nums;
}
.lastv:active{color:var(--accent)}
.addset{width:100%;min-height:var(--tap);color:var(--accent);font-size:15px}
.sess-foot{display:flex;flex-direction:column;gap:10px;margin-top:20px}

/* Fin de entrenamiento */
.finish{padding:16px 16px 40px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum div{padding:12px 14px;border-radius:12px;background:var(--surface)}
.sum b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.sum span{color:var(--muted);font-size:12.5px}
.note-area{
  width:100%;min-height:148px;
  padding:12px;
  border-radius:12px;
  background:var(--surface-2);
  border:1px solid transparent;
  line-height:1.45;
  resize:none;
}
.note-area:focus{outline:none;border-color:var(--accent)}

/* ============================================================
   CALENDARIO E HISTORIAL
   ============================================================ */
.cal-nav{display:flex;align-items:center;padding:8px 12px 4px}
.cal-nav button{
  width:var(--tap);height:var(--tap);
  display:grid;place-items:center;color:var(--accent);
}
.cal-nav button svg{width:9px;height:15px;stroke-width:2.2}
.cal-nav button.prev svg{transform:scaleX(-1)}
.cal-nav button:disabled{color:#3A3A3D}
.cal-title{flex:1 1 auto;text-align:center;font-size:17px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 12px}
.cal-dow{padding:6px 0;text-align:center;color:var(--muted);font-size:11px}
.cal-day{
  position:relative;
  min-height:46px;
  display:grid;place-items:center;
  border-radius:11px;
  font-size:15px;font-variant-numeric:tabular-nums;
}
.cal-day.out{color:#333336}
.cal-day.today{box-shadow:inset 0 0 0 1.5px #48484A}
.cal-day.has{background:var(--accent-solid);color:#fff;font-weight:600;box-shadow:none}
.cal-day.today.has{box-shadow:inset 0 0 0 1.5px #fff}
.cal-day .dot{
  position:absolute;bottom:6px;
  width:4px;height:4px;border-radius:2px;background:#fff;
}
.cal-day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-day.has.sel{box-shadow:inset 0 0 0 2px #fff}
.cal-legend{padding:18px 18px 8px;color:var(--muted);font-size:13px}
.cal-month{padding:0 16px 8px;text-align:center;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.cal-day .sbar{
  position:absolute;bottom:6px;left:50%;
  width:14px;height:3px;margin-left:-7px;border-radius:2px;
  background:#FFFFFF;
}
.cal-key{
  display:flex;justify-content:center;gap:18px;
  padding:10px 16px 0;color:var(--muted);font-size:12px;
}
.cal-key span{display:inline-flex;align-items:center;gap:6px}
.cal-key i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--accent-solid)}
.cal-key i.bar{width:14px;height:3px;border-radius:2px;background:#FFFFFF}
.daysum{
  margin:0 16px;padding:12px 14px;
  border-radius:12px;background:var(--surface);
  font-size:15px;font-variant-numeric:tabular-nums;
}
.daysum b{font-weight:600}
.daysec{margin:20px 18px 8px;color:var(--muted);font-size:13px}
.dayempty{margin:0 18px;color:var(--muted);font-size:14px}
.study-card{display:block}
.study-card .snote{
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  margin-top:8px;color:var(--text);font-size:14px;line-height:1.45;white-space:pre-wrap;
}

/* Ficha de una sesion */

<script>
"use strict";

/* ============================================================
   1. ALMACENAMIENTO
   ============================================================ */

const APP_VERSION = "2.0";
const STORAGE_KEY = "hugo.gym";   /* no se cambia: es donde viven tus datos */
const SCHEMA_VERSION = 2;

const DEFAULT_MUSCLES = ["Pecho","Espalda","Hombro","Bíceps","Tríceps","Cuádriceps",
  "Femoral","Glúteo","Gemelo","Abdomen","Antebrazo","Trapecio"];

function uid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,10);
}

function emptyData(){
  return {
    schemaVersion: SCHEMA_VERSION,
    muscles: DEFAULT_MUSCLES.slice(),
    exercises: [],
    routines: [],
    sessions: [],
    activeSession: null,
    studySessions: [],      /* v2: registro de estudio */
    activeStudy: null,      /* v2: sesion de estudio en curso */
    settings: { lastExportAt: null, lastExportSessions: 0 }
  };
}

/* Migracion al abrir la app y al importar. Solo AÑADE lo que falta: no
   borra ni cambia nada de lo existente, y aplicarla dos veces da lo mismo
   que aplicarla una. Sirve tanto para datos de la v1 como de la v2. */
function migrate(d){
  const base = emptyData();
  if (!d || typeof d !== "object") return base;
  const out = Object.assign(base, d);
  if (!Array.isArray(out.muscles) || !out.muscles.length) out.muscles = base.muscles;
  ["exercises","routines","sessions"].forEach(k=>{ if(!Array.isArray(out[k])) out[k]=[]; });
  out.settings = Object.assign(base.settings, d.settings || {});
  if (out.activeSession) delete out.activeSession.restEndsAt;

  /* v1 -> v2: todo ejercicio sin tipo se mide por repeticiones. */
  out.exercises.forEach(ex => {
    if (!ex || typeof ex !== "object") return;
    if (ex.trackingType !== "reps" && ex.trackingType !== "time") ex.trackingType = "reps";
    if (ex.trackingType === "time" && ex.timeGoal !== "more" && ex.timeGoal !== "less") ex.timeGoal = "more";
  });
  /* v1 -> v2: registro de estudio vacio. */
  if (!Array.isArray(out.studySessions)) out.studySessions = [];
  if (out.activeStudy === undefined) out.activeStudy = null;

  out.schemaVersion = SCHEMA_VERSION;
  return out;
}

const Store = {
  data: emptyData(),
  broken: false,

  load(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw){ this.data = emptyData(); return; }
      const parsed = JSON.parse(raw);
      const before = parsed && parsed.schemaVersion;
      this.data = migrate(parsed);
      if (before !== SCHEMA_VERSION){
        /* Seguro antes de reescribir: copia literal de los datos tal como
           estaban, en una clave aparte que nunca se toca despues. */
        const bk = STORAGE_KEY + ".antes-v" + SCHEMA_VERSION;
        try { if (!localStorage.getItem(bk)) localStorage.setItem(bk, raw); } catch(e2){}
        this.save();
      }
    } catch (e) {
      console.error("No se han podido leer los datos:", e);
      this.data = emptyData();
      this.broken = true;
    }
  },

  save(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data));
      return true;
    } catch (e) {
      console.error("No se han podido guardar los datos:", e);
      toast("No se han podido guardar los cambios");
      return false;
    }
  },

  bytes(){
    try { return new Blob([localStorage.getItem(STORAGE_KEY) || ""]).size; }
    catch(e){ return 0; }
  }
};

/* ============================================================
   2. EJERCICIOS
   ============================================================ */

/* Compara ignorando mayusculas, acentos y espacios de sobra. */
function norm(s){
  return (s||"").toString().trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

const Exercises = {
  all(){ return Store.data.exercises; },

  active(){ return Store.data.exercises.filter(e => !e.archived); },

  byId(id){ return Store.data.exercises.find(e => e.id === id) || null; },

  nameTaken(name, ignoreId){
    const n = norm(name);
    return Store.data.exercises.some(e => e.id !== ignoreId && !e.archived && norm(e.name) === n);
  },

  create(name, muscle, trackingType, timeGoal){
    const ex = {
      id: uid(),
      name: name.trim(),
      muscle: muscle,
      createdAt: new Date().toISOString(),
      archived: false,
      trackingType: trackingType === "time" ? "time" : "reps"
    };
    if (ex.trackingType === "time") ex.timeGoal = timeGoal === "less" ? "less" : "more";
    Store.data.exercises.push(ex);
    Store.save();
    return ex;
  },

  /* El tipo y el objetivo solo cambian si el ejercicio no tiene historial:
     medirlo de otra forma a mitad dejaria las graficas sin sentido. */
  update(id, name, muscle, trackingType, timeGoal){
    const ex = this.byId(id);
    if (!ex) return null;
    ex.name = name.trim();
    ex.muscle = muscle;
    if (trackingType && this.usage(id).sessions === 0){
      ex.trackingType = trackingType === "time" ? "time" : "reps";
      if (ex.trackingType === "time") ex.timeGoal = timeGoal === "less" ? "less" : "more";
      else delete ex.timeGoal;
    }
    Store.save();
    return ex;
  },

  /* Borrado logico: el historico nunca se toca. */
  setArchived(id, archived){
    const ex = this.byId(id);
    if (!ex) return;
    ex.archived = !!archived;
    Store.save();
  },

  /* Donde se esta usando: decide si se puede borrar de verdad o solo archivar. */
  usage(id){
    const sessions = Store.data.sessions.filter(s =>
      (s.exercises || []).some(e => e.exerciseId === id)).length;
    const routines = Store.data.routines.filter(r =>
      r.exercises.some(e => e.exerciseId === id));
    return { sessions: sessions, routines: routines };
  },

  /* Borrado definitivo. Solo cuando no hay ninguna sesion que lo use:
     si hubiera historico, la grafica y el historial se quedarian huerfanos. */
  remove(id){
    if (this.usage(id).sessions > 0) return false;
    Store.data.routines.forEach(r => {
      r.exercises = r.exercises.filter(e => e.exerciseId !== id)
        .map((e,i) => ({ exerciseId:e.exerciseId, order:i, targetSets:e.targetSets }));
    });
    Store.data.exercises = Store.data.exercises.filter(e => e.id !== id);
    Store.save();
    return true;
  },

  sorted(list){
    return list.slice().sort((a,b) => a.name.localeCompare(b.name, "es", {sensitivity:"base"}));
  }
};

/* ============================================================
   2b. RUTINAS
   ============================================================ */

const Routines = {
  byId(id){ return Store.data.routines.find(r => r.id === id) || null; },

  sorted(list){
    return list.slice().sort((a,b) => a.name.localeCompare(b.name, "es", {sensitivity:"base"}));
  },

  nameTaken(name, ignoreId){
    const n = norm(name);
    return Store.data.routines.some(r => r.id !== ignoreId && !r.archived && norm(r.name) === n);
  },

  totalSets(r){
    return r.exercises.reduce((s,e) => s + (e.targetSets || 0), 0);
  },

  /* Guarda el borrador: el orden de la lista manda sobre el campo order. */
  save(draft){
    const items = draft.items.map((it,i) => ({
      exerciseId: it.exerciseId,
      order: i,
      targetSets: it.targetSets
    }));
    if (draft.id){
      const r = this.byId(draft.id);
      if (!r) return null;
      r.name = draft.name.trim();
      r.exercises = items;
      Store.save();
      return r;
    }
    const r = {
      id: uid(),
      name: draft.name.trim(),
      createdAt: new Date().toISOString(),
      archived: false,
      exercises: items
    };
    Store.data.routines.push(r);
    Store.save();
    return r;
  },

  setArchived(id, archived){
    const r = this.byId(id);
    if (!r) return;
    r.archived = !!archived;
    Store.save();
  },

  /* Una rutina se puede borrar siempre: las sesiones guardan el nombre
     que tenia ese dia, asi que el historico no depende de ella. */
  remove(id){
    Store.data.routines = Store.data.routines.filter(r => r.id !== id);
    Store.save();
  },

  duplicate(id){
    const r = this.byId(id);
    if (!r) return null;
    let name = r.name + " (copia)";
    let n = 2;
    while (this.nameTaken(name, null)) { name = r.name + " (copia " + n + ")"; n++; }
    const copy = {
      id: uid(),
      name: name,
      createdAt: new Date().toISOString(),
      archived: false,
      exercises: r.exercises.map(e => ({ exerciseId:e.exerciseId, order:e.order, targetSets:e.targetSets }))
    };
    Store.data.routines.push(copy);
    Store.save();
    return copy;
  }
};

/* ============================================================
   2c. SESIONES
   ============================================================ */

function nowISO(){ return new Date().toISOString(); }

/* Fechas siempre en hora local: un entreno de las 23:30 es de ese dia. */
function localDayKey(iso){
  const d = new Date(iso);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

/* Una serie cuenta en cuanto tiene algo escrito: no hay que marcarla. */
function hasData(s){
  const has = v => v !== null && v !== undefined;
  return has(s.weight) || has(s.reps) || has(s.durationSeconds);
}
/* Tipo de un bloque de sesion. Las sesiones de la v1 no lo guardaban: eran de reps. */
function blockType(b){ return b && b.trackingTypeSnapshot === "time" ? "time" : "reps"; }
function completedSets(block){ return (block.sets || []).filter(s => s.completed && hasData(s)); }

const Sessions = {
  byDateDesc(){
    return Store.data.sessions.slice().sort((a,b) => new Date(b.startedAt) - new Date(a.startedAt));
  },

  /* Series completadas del ejercicio la ultima vez que aparecio.
     occurrence distingue el mismo ejercicio repetido dentro de una rutina. */
  lastTime(exerciseId, occurrence){
    for (const s of this.byDateDesc()){
      const blocks = (s.exercises || [])
        .filter(e => e.exerciseId === exerciseId)
        .sort((a,b) => a.order - b.order);
      if (!blocks.length) continue;
      const block = blocks[Math.min(occurrence, blocks.length - 1)];
      const sets = completedSets(block);
      if (sets.length) return { date: s.startedAt, sets: sets };
    }
    return null;
  },

};


/* ============================================================
   2d. ESTUDIO
   ============================================================ */

/* Una sesion de estudio guarda tramos {start, end}: cada pausa cierra uno y
   reanudar abre otro. El tiempo se calcula siempre con marcas de tiempo, asi
   que es exacto aunque el movil se bloquee, se cierre la app o se reinicie. */
const Study = {
  active(){ return Store.data.activeStudy; },

  running(){
    const a = this.active();
    if (!a || !a.intervals.length) return false;
    return a.intervals[a.intervals.length - 1].end === null;
  },

  secondsOf(intervals){
    return intervals.reduce((n, iv) => {
      const end = iv.end ? new Date(iv.end).getTime() : Date.now();
      return n + Math.max(0, end - new Date(iv.start).getTime());
    }, 0) / 1000;
  },

  elapsed(){
    const a = this.active();
    return a ? this.secondsOf(a.intervals) : 0;
  },

  start(){
    if (this.active()) return false;              /* nunca dos de estudio */
    const now = nowISO();
    Store.data.activeStudy = { id: uid(), startedAt: now, intervals: [{ start: now, end: null }] };
    Store.save();
    return true;
  },

  pause(){
    if (!this.running()) return;
    this.active().intervals[this.active().intervals.length - 1].end = nowISO();
    Store.save();
  },

  resume(){
    const a = this.active();
    if (!a || this.running()) return;
    a.intervals.push({ start: nowISO(), end: null });
    Store.save();
  },

  discard(){
    Store.data.activeStudy = null;
    Store.save();
  },

  /* Convierte la sesion en curso en un registro guardado. */
  finish(){
    const a = this.active();
    if (!a) return null;
    if (this.running()) a.intervals[a.intervals.length - 1].end = nowISO();
    const intervals = a.intervals.map(iv => ({ start: iv.start, end: iv.end }));
    const session = {
      id: a.id,
      startedAt: a.startedAt,
      endedAt: intervals[intervals.length - 1].end,
      intervals: intervals,
      durationSeconds: Math.round(this.secondsOf(intervals)),
      notes: "",
      rating: null
    };
    Store.data.studySessions.push(session);
    Store.data.activeStudy = null;
    Store.save();
    return session;
  },

  byId(id){ return Store.data.studySessions.find(x => x.id === id) || null; },

  byDateDesc(){
    return Store.data.studySessions.slice().sort((a,b) => new Date(b.startedAt) - new Date(a.startedAt));
  },

  /* Cuenta para el dia en que empezo, aunque cruce la medianoche. */
  ofDay(key){
    return Store.data.studySessions
      .filter(x => localDayKey(x.startedAt) === key)
      .sort((a,b) => new Date(a.startedAt) - new Date(b.startedAt));
  },

  /* Total desde una fecha, incluida la sesion en curso si empezo despues. */
  totalSince(from){
    let t = 0;
    Store.data.studySessions.forEach(x => { if (new Date(x.startedAt) >= from) t += x.durationSeconds || 0; });
    const a = this.active();
    if (a && new Date(a.startedAt) >= from) t += this.elapsed();
    return t;
  },

  todaySeconds(){
    const d = new Date(); d.setHours(0,0,0,0);
    return this.totalSince(d);
  },

  /* La semana va de lunes a domingo. */
  weekSeconds(){
    const d = new Date(); d.setHours(0,0,0,0);
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return this.totalSince(d);
  },

  /* Alta a mano o edicion. Si no cambian inicio ni duracion, se conservan
     los tramos reales con sus pausas; si cambian, pasa a ser un tramo unico. */
  save(fields, id){
    const start = new Date(fields.startedAt);
    const end = new Date(start.getTime() + fields.durationSeconds * 1000);
    const single = [{ start: start.toISOString(), end: end.toISOString() }];
    if (id){
      const x = this.byId(id);
      if (!x) return null;
      /* El formulario trabaja al minuto: se compara al minuto para no
         reescribir los tramos reales cuando solo cambias la nota. */
      const minute = t => Math.floor(new Date(t).getTime() / 60000);
      const same = minute(x.startedAt) === minute(start) &&
                   Math.round(x.durationSeconds / 60) === Math.round(fields.durationSeconds / 60);
      if (!same){
        x.startedAt = start.toISOString();
        x.endedAt = end.toISOString();
        x.intervals = single;
        x.durationSeconds = fields.durationSeconds;
      }
      x.notes = fields.notes;
      x.rating = fields.rating;
      Store.save();
      return x;
    }
    const x = {
      id: uid(),
      startedAt: start.toISOString(),
      endedAt: end.toISOString(),
      intervals: single,
      durationSeconds: fields.durationSeconds,
      notes: fields.notes,
      rating: fields.rating
    };
    Store.data.studySessions.push(x);
    Store.save();
    return x;
  },

  remove(id){
    Store.data.studySessions = Store.data.studySessions.filter(x => x.id !== id);
    Store.save();
  }
};

const RATINGS = { poco: "Poco", normal: "Normal", mucho: "Mucho" };

/* Duraciones de resumen: "1 h 25 min". */
function fmtHM(sec){
  sec = Math.max(0, Math.round(sec || 0));
  const m = Math.floor(sec / 60);
  if (m < 1) return sec > 0 ? "<1 min" : "0 min";
  const h = Math.floor(m / 60), r = m % 60;
  if (!h) return r + " min";
  return r ? h + " h " + r + " min" : h + " h";
}
/* Cronometro grande: HH:MM:SS. */
function fmtHMS(sec){
  sec = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), x = sec % 60;
  return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0") + ":" + String(x).padStart(2,"0");
}

/* ---------- Sesion en curso ---------- */

const Active = {
  get(){ return Store.data.activeSession; },

  blockFrom(exercise){
    const b = {
      exerciseId: exercise.id,
      exerciseNameSnapshot: exercise.name,
      muscleSnapshot: exercise.muscle,
      trackingTypeSnapshot: exercise.trackingType === "time" ? "time" : "reps",
      sets: []
    };
    if (b.trackingTypeSnapshot === "time") b.timeGoalSnapshot = exercise.timeGoal === "less" ? "less" : "more";
    return b;
  },

  emptySet(){ return { weight:null, reps:null, durationSeconds:null, rir:null, completed:true }; },

  start(routine){
    const blocks = [];
    let skipped = 0;
    if (routine){
      routine.exercises.slice().sort((a,b) => a.order - b.order).forEach(item => {
        const ex = Exercises.byId(item.exerciseId);
        if (!ex){ skipped++; return; }
        if (ex.archived){ skipped++; return; }
        const b = this.blockFrom(ex);
        for (let i = 0; i < Math.max(1, item.targetSets); i++) b.sets.push(this.emptySet());
        blocks.push(b);
      });
    }
    Store.data.activeSession = {
      id: uid(),
      startedAt: nowISO(),
      routineId: routine ? routine.id : null,
      routineNameSnapshot: routine ? routine.name : "Entrenamiento libre",
      notes: "",
      exercises: blocks
    };
    Store.save();
    return skipped;
  },

  countCompleted(){
    const a = this.get();
    if (!a) return 0;
    return a.exercises.reduce((n,b) => n + b.sets.filter(hasData).length, 0);
  },

  elapsed(){
    const a = this.get();
    return a ? (Date.now() - new Date(a.startedAt).getTime()) / 1000 : 0;
  },

  discard(){
    Store.data.activeSession = null;
    Store.save();
  },

  /* Convierte la sesion en curso en la fotografia inmutable que se guarda.
     Se guarda lo escrito y se tiran las filas vacias. */
  finish(){
    const a = this.get();
    if (!a) return null;
    stopAnyStopwatch();                 /* un cronometro en marcha se guarda con su tiempo */
    const end = new Date();
    const exercises = [];
    a.exercises.forEach(b => {
      const time = blockType(b) === "time";
      const sets = b.sets
        .filter(hasData)
        .map((s,i) => {
          const out = {
            setNumber: i + 1,
            weight: s.weight === undefined ? null : s.weight,
            reps: time ? null : (s.reps === undefined ? null : s.reps),
            rir: (s.rir === null || s.rir === undefined) ? null : s.rir,
            completed: true
          };
          if (time) out.durationSeconds = (s.durationSeconds === undefined ? null : s.durationSeconds);
          return out;
        });
      if (sets.length){
        const blk = {
          exerciseId: b.exerciseId,
          exerciseNameSnapshot: b.exerciseNameSnapshot,
          muscleSnapshot: b.muscleSnapshot,
          trackingTypeSnapshot: blockType(b),
          order: exercises.length,
          sets: sets
        };
        if (time) blk.timeGoalSnapshot = b.timeGoalSnapshot === "less" ? "less" : "more";
        exercises.push(blk);
      }
    });

    const session = {
      id: a.id,
      startedAt: a.startedAt,
      endedAt: end.toISOString(),
      durationSeconds: Math.max(0, Math.round((end - new Date(a.startedAt)) / 1000)),
      routineId: a.routineId,
      routineNameSnapshot: a.routineNameSnapshot,
      notes: a.notes || "",
      exercises: exercises
    };

    Store.data.sessions.push(session);
    Store.data.activeSession = null;
    Store.save();
    return { session };
  }
};

function sessionVolume(session){
  let vol = 0, sets = 0;
  session.exercises.forEach(b => completedSets(b).forEach(s => {
    sets++;
    if (blockType(b) === "reps" && s.weight > 0 && s.reps) vol += s.weight * s.reps;
  }));
  return { volume: Math.round(vol), sets: sets, exercises: session.exercises.length };
}

   3. UTILIDADES DE INTERFAZ
   ============================================================ */

function esc(s){
  return (s||"").toString()
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* Numeros con coma decimal, como el teclado espanol. */
function fmtNum(n){
  if (n === null || n === undefined || isNaN(n)) return "";
  return (Math.round(n * 100) / 100).toString().replace(".", ",");
}
function parseNum(v){
  if (v === null || v === undefined) return null;
  const t = String(v).replace(",", ".").trim();
  if (t === "" || t === "-" || t === ".") return null;
  const n = parseFloat(t);
  return isNaN(n) ? null : n;
}
function parseWhole(v){
  const n = parseNum(v);
  return n === null ? null : Math.round(n);
}
function fmtDur(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h
    ? h + ":" + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0")
    : m + ":" + String(s).padStart(2,"0");
}
function setDesc(s, type){
  if (type === "time"){
    const t = fmtClock(s.durationSeconds);
    const w = (s.weight === null || s.weight === undefined || s.weight === 0) ? "" : fmtNum(s.weight) + " kg";
    if (!t) return w || "—";
    return w ? w + " · " + t : t;
  }
  if (s.weight === null) return (s.reps || 0) + " reps";
  if (s.weight === 0) return "Peso corporal × " + (s.reps || 0);
  return fmtNum(s.weight) + " kg × " + (s.reps || 0);
}

/* Tiempo de una serie: m:ss (o h:mm:ss si pasa de una hora). */
function fmtClock(sec){
  if (sec === null || sec === undefined || isNaN(sec)) return "";
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), x = sec % 60;
  return h ? h + ":" + String(m).padStart(2,"0") + ":" + String(x).padStart(2,"0")
           : m + ":" + String(x).padStart(2,"0");
}

/* El teclado numerico del iPhone no tiene dos puntos: las cifras entran como
   en un microondas. 1 → 0:01, 13 → 0:13, 130 → 1:30. */
function clockDigits(v){ return String(v || "").replace(/\D/g, "").replace(/^0+/, "").slice(-4); }
function clockTyping(v){
  const d = clockDigits(v);
  if (!d) return "";
  const p = d.padStart(3, "0");
  return String(+p.slice(0, -2)) + ":" + p.slice(-2);
}
function clockSeconds(v){
  const d = clockDigits(v);
  if (!d) return null;
  return (+d.slice(0, -2) || 0) * 60 + (+d.slice(-2));
}

/* La pantalla no se apaga mientras entrenas. */
let wakeLock = null;
async function requestWake(){
  try {
    if ("wakeLock" in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    }
  } catch(e){}
}
function releaseWake(){
  try { if (wakeLock) wakeLock.release(); } catch(e){}
  wakeLock = null;
}

let toastTimer = null;
function toast(msg){
  const layer = document.getElementById("layer");
  const old = layer.querySelector(".toast");
  if (old) old.remove();
  clearTimeout(toastTimer);
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  layer.appendChild(el);
  toastTimer = setTimeout(() => el.remove(), 2000);
}

/* Hoja inferior generica. onClose se llama al cerrar por cualquier via. */
function openSheet(html, onMount, onClose){
  closeSheet();
  const layer = document.getElementById("layer");
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = '<div class="sheet"><div class="grabber"></div>' + html + '</div>';
  overlay.addEventListener("click", ev => { if (ev.target === overlay) closeSheet(); });
  layer.appendChild(overlay);
  overlay._onClose = onClose;
  if (onMount) onMount(overlay.querySelector(".sheet"));
  return overlay;
}

function closeSheet(){
  const overlay = document.querySelector(".overlay");
  if (!overlay) return;
  const cb = overlay._onClose;
  if (cb) cb();
  overlay.remove();
}

/* Confirmacion antes de cualquier accion destructiva. */
function confirmAction({title, message, okText, danger}){
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if (!done) { done = true; resolve(v); } };
    openSheet(
      '<h2>' + esc(title) + '</h2>' +
      (message ? '<p>' + esc(message) + '</p>' : '') +
      '<div class="btn-row">' +
        '<button class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '" data-ok>' + esc(okText || "Aceptar") + '</button>' +
        '<button class="btn btn-ghost" data-cancel>Cancelar</button>' +
      '</div>',
      sheet => {
        sheet.querySelector("[data-ok]").addEventListener("click", () => { finish(true); closeSheet(); });
        sheet.querySelector("[data-cancel]").addEventListener("click", () => { finish(false); closeSheet(); });
      },
      () => finish(false)
    );
  });
}

      if (!name) return fail("Escribe un nombre para el ejercicio.");
      if (Exercises.nameTaken(name, ex ? ex.id : null)) return fail("Ya tienes un ejercicio con ese nombre.");
      if (ex) { Exercises.update(ex.id, name, muscleEl.value, typeSeg ? type : null, goal); toast("Ejercicio actualizado"); }
      else    { Exercises.create(name, muscleEl.value, type, goal); toast("Ejercicio creado"); }
      closeSheet();
      render();
    });

    sheet.querySelector("#f-cancel").addEventListener("click", closeSheet);

    const archBtn = sheet.querySelector("#f-archive");
    if (archBtn){
      archBtn.addEventListener("click", async () => {
        if (ex.archived){
          Exercises.setArchived(ex.id, false);
          closeSheet();
          toast("Ejercicio restaurado");
          render();
          return;
        }
        nameEl.blur();
        const ok = await confirmAction({
          title: "¿Archivar " + ex.name + "?",
          message: "Dejará de aparecer al crear rutinas y al entrenar, pero sigue intacto en todo tu histórico. Puedes restaurarlo cuando quieras.",
          okText: "Archivar",
          danger: true
        });
        if (ok){
          Exercises.setArchived(ex.id, true);
          closeSheet();
          toast("Ejercicio archivado");
          render();
        }
      });
    }

    const delBtn = sheet.querySelector("#f-delete");
    if (delBtn){
      delBtn.addEventListener("click", async () => {
        nameEl.blur();
        const used = Exercises.usage(ex.id).routines;
        const ok = await confirmAction({
          title: "¿Borrar " + ex.name + "?",
          message: used.length
            ? "Se quitará también de " + used.length + (used.length === 1 ? " rutina: " : " rutinas: ") +
              used.map(r => r.name).join(", ") + ". No se puede deshacer."
            : "Se borra para siempre. No se puede deshacer.",
          okText: "Borrar",
          danger: true
        });
        if (!ok) return;
        if (Exercises.remove(ex.id)){
          closeSheet();
          if (ui.screen === "exercise"){ ui.screen = null; ui.exerciseId = null; }
          toast("Ejercicio borrado");
          render();
        } else {
          toast("Tiene entrenamientos registrados: solo se puede archivar");
        }
      });
    }
  });
}

function draftFromRoutine(r){
  const items = r
    ? r.exercises.slice().sort((a,b) => a.order - b.order)
        .map(e => ({ key:uid(), exerciseId:e.exerciseId, targetSets:e.targetSets }))
    : [];
  return { id: r ? r.id : null, name: r ? r.name : "", items: items };
}

function draftSnapshot(d){
  return JSON.stringify({
    name: d.name.trim(),
    items: d.items.map(i => [i.exerciseId, i.targetSets])
  });
}

function draftDirty(){
  return ui.draft && draftSnapshot(ui.draft) !== ui.draftBase;
}

function openRoutineEditor(id){

  ui.draft = draftFromRoutine(r);

/* Reordenar arrastrando el asa. Las filas miden todas lo mismo, asi que el
   indice destino sale de dividir el desplazamiento entre el alto de fila. */
function initDrag(){
  const list = document.getElementById("rt-list");
  if (!list) return;
  let drag = null;

  const shift = () => {
    drag.rows.forEach((r,i) => {
      if (r === drag.row) return;
      let t = 0;
      if (drag.from < drag.to && i > drag.from && i <= drag.to) t = -drag.h;
      else if (drag.from > drag.to && i >= drag.to && i < drag.from) t = drag.h;
      r.style.transform = t ? "translateY(" + t + "px)" : "";
    });
  };

  list.addEventListener("pointerdown", ev => {
    const handle = ev.target.closest(".rt-handle");
    if (!handle) return;
    const row = handle.closest(".rt-row");
    const rows = Array.from(list.querySelectorAll(".rt-row"));
    if (rows.length < 2) return;
    ev.preventDefault();
    handle.setPointerCapture(ev.pointerId);
    const from = rows.indexOf(row);
    drag = { row, rows, from, to: from, startY: ev.clientY, h: row.offsetHeight };
    row.classList.add("dragging");
  });

  list.addEventListener("pointermove", ev => {
    if (!drag) return;
    ev.preventDefault();
    const dy = ev.clientY - drag.startY;
    drag.row.style.transform = "translateY(" + dy + "px)";
    let to = drag.from + Math.round(dy / drag.h);
    to = Math.max(0, Math.min(drag.rows.length - 1, to));
    if (to !== drag.to){ drag.to = to; shift(); }
  });

  const finish = () => {
    if (!drag) return;
    const { from, to } = drag;
    drag.rows.forEach(r => { r.style.transform = ""; });
    drag.row.classList.remove("dragging");
    drag = null;
    if (from !== to){
      const items = ui.draft.items;
      items.splice(to, 0, items.splice(from, 1)[0]);
    }
    render();
  };
  list.addEventListener("pointerup", finish);
  list.addEventListener("pointercancel", finish);
}

/* Se llama despues de cada pintado del editor. */

/* ---------- Selector de ejercicios ---------- */

function openExercisePicker(opts){
  const already = opts.already || (() => 0);
  const selected = [];

  const listHtml = q => {
    const nq = norm(q);
    let pool = Exercises.sorted(Exercises.active());
    if (nq) pool = pool.filter(e => norm(e.name).includes(nq) || norm(e.muscle).includes(nq));
    if (!pool.length) return '<div class="empty" style="margin:28px 16px">Ningún ejercicio coincide.</div>';
    return pool.map(e => {
      const inUse = already(e.id);
      const picked = selected.filter(id => id === e.id).length;
      return '<button class="pick" data-pick="' + e.id + '" aria-pressed="' + (picked > 0) + '">' +
        '<span class="pick-main">' +
          '<span class="pick-name">' + esc(e.name) + '</span>' +
          '<span class="pick-sub">' + esc(e.muscle) +
            (inUse ? ' · ya está' : '') + '</span>' +
        '</span>' +
        '<span class="check">' + ICONS.check + '</span>' +
      '</button>';
    }).join("");
  };

  openSheet(
    '<h2>Añadir ejercicios</h2>' +
    '<input class="search" id="p-search" type="search" inputmode="search" placeholder="Buscar ejercicio" autocomplete="off" autocapitalize="none">' +
    '<div class="picker-list" id="p-list"></div>' +
    '<div class="btn-row" style="margin-top:16px">' +
      '<button class="btn btn-primary" id="p-add" disabled>Añadir</button>' +
      '<button class="btn btn-ghost" data-cancel>Cancelar</button>' +
    '</div>',
    sheet => {
      const search = sheet.querySelector("#p-search");
      const listEl = sheet.querySelector("#p-list");
      const addBtn = sheet.querySelector("#p-add");

      const refreshAdd = () => {
        addBtn.disabled = selected.length === 0;
        addBtn.textContent = selected.length ? "Añadir (" + selected.length + ")" : "Añadir";
      };
      const paint = () => {
        listEl.innerHTML = listHtml(search.value);
        refreshAdd();
      };
      paint();

      search.addEventListener("input", paint);

      /* Al marcar solo cambia ese boton: repintar la lista entera
         devolveria el scroll al principio. */
      listEl.addEventListener("click", ev => {
        const btn = ev.target.closest("[data-pick]");
        if (!btn) return;
        const id = btn.dataset.pick;
        const at = selected.indexOf(id);
        if (at >= 0) selected.splice(at, 1); else selected.push(id);
        btn.setAttribute("aria-pressed", at < 0);
        refreshAdd();
      });

      addBtn.addEventListener("click", () => {
        const ids = selected.slice();
        closeSheet();
        opts.onAdd(ids);
        render();
        toast(ids.length === 1 ? "Ejercicio añadido" : ids.length + " ejercicios añadidos");
      });

      sheet.querySelector("[data-cancel]").addEventListener("click", closeSheet);
    }
  );
}

/* El cronometro y el descanso se actualizan sin repintar la vista,
   para no quitarle el foco a un campo mientras escribes. */
let ticker = null;
function startTicker(){ if (!ticker) ticker = setInterval(tick, 500); tick(); }
function stopTicker(){ clearInterval(ticker); ticker = null; }

function tick(){
  const a = Active.get();
  const st = Study.active();
  if (!a && !st){ stopTicker(); return; }
  if (st){
    const el = document.getElementById("study-clock");
    if (el) el.textContent = fmtHMS(Study.elapsed());
  }
  if (!a) return;
  const chrono = document.getElementById("chrono");
  if (chrono && !chrono.hidden) chrono.textContent = fmtDur(Active.elapsed());
  const cont = document.getElementById("cont-time");
  if (cont) cont.textContent = fmtDur(Active.elapsed());

  if (ui.screen === "session"){
    a.exercises.forEach((b,bi) => b.sets.forEach((set,si) => {
      if (!set.timerStartedAt) return;
      const el = document.querySelector('.set[data-b="' + bi + '"][data-s="' + si + '"] [data-f="time"]');
      if (el) el.value = fmtClock((Date.now() - set.timerStartedAt) / 1000);
    }));
  }
}

/* Cronometro de una serie de tiempo. Guarda la hora de inicio en la propia
   serie, asi que sigue siendo exacto con la pantalla bloqueada o la app en
   segundo plano. Solo puede haber uno en marcha. */
function stopAnyStopwatch(){
  const a = Active.get();
  if (!a) return false;
  let stopped = false;
  a.exercises.forEach(b => b.sets.forEach(set => {
    if (set.timerStartedAt){
      set.durationSeconds = Math.max(0, Math.round((Date.now() - set.timerStartedAt) / 1000));
      delete set.timerStartedAt;
      stopped = true;
    }
  }));
  return stopped;
}

function toggleStopwatch(row){
  const ref = currentSet(row);
  if (!ref) return;
  const wasRunning = !!ref.set.timerStartedAt;
  stopAnyStopwatch();
  if (!wasRunning){
    ref.set.durationSeconds = null;        /* empezar de cero */
    ref.set.timerStartedAt = Date.now();
  }
  saveNow();
  render();
}

/* Guardado continuo: cada tecla se persiste, con un respiro de 400 ms. */
let saveTimer = null;
function saveSoon(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => Store.save(), 400);
}
function saveNow(){
  clearTimeout(saveTimer);
  Store.save();
}

/* Las filas de series se editan igual en la sesion en curso que en una pasada. */
function editingBlocks(){
  if (ui.screen === "session") return Active.get() ? Active.get().exercises : null;
  if (ui.screen === "sessionEdit") return ui.editDraft ? ui.editDraft.exercises : null;
  return null;
}
function persistEdits(){ if (ui.screen === "session") saveNow(); }

function currentSet(el){
  const row = el.closest(".set");
  if (!row) return null;
  const blocks = editingBlocks();
  if (!blocks) return null;
  const b = blocks[+row.dataset.b];
  if (!b) return null;
  return { row, block: b, set: b.sets[+row.dataset.s] };
}

function openSessionNotes(){
  const a = Active.get();
  if (!a) return;
  openSheet(
    '<h2>Notas del entrenamiento</h2>' +
    '<textarea class="note-area" id="n-text" placeholder="Cómo te has encontrado, molestias, sueño, comidas…">' +
      esc(a.notes || "") + '</textarea>' +
    '<div class="btn-row" style="margin-top:14px"><button class="btn btn-primary" id="n-ok">Listo</button></div>',
    sheet => {
      const ta = sheet.querySelector("#n-text");
      setTimeout(() => ta.focus(), 60);
      sheet.querySelector("#n-ok").addEventListener("click", () => {
        a.notes = ta.value;
        saveNow();
        closeSheet();
        render();
      });
    },
    () => {
      const ta = document.getElementById("n-text");
      if (ta){ a.notes = ta.value; saveNow(); }
      const btn = document.getElementById("btn-note");
      if (btn) btn.classList.toggle("has", !!(a.notes && a.notes.trim()));
    }
  );
}

function openSessionExerciseMenu(bi){
  const blocks = editingBlocks();
  if (!blocks) return;
  const b = blocks[bi];
  if (!b) return;
  const opt = (act, label, style) =>
    '<button class="btn btn-ghost" data-act="' + act + '"' + (style || "") + '>' + label + '</button>';

  openSheet(
    '<h2>' + esc(b.exerciseNameSnapshot) + '</h2>' +
    '<div class="btn-row">' +
      opt("add", "Añadir serie") +
      (b.sets.length > 1 ? opt("rem", "Quitar la última serie") : "") +
      (bi > 0 ? opt("up", "Subir") : "") +
      (bi < blocks.length - 1 ? opt("down", "Bajar") : "") +
      opt("skip", "Quitar el ejercicio", ' style="color:var(--danger)"') +
      opt("cancel", "Cancelar") +
    '</div>',
    sheet => {
      sheet.addEventListener("click", async ev => {
        const btn = ev.target.closest("[data-act]");
        if (!btn) return;
        const act = btn.dataset.act;
        if (act === "cancel"){ closeSheet(); return; }
        if (act === "add"){ b.sets.push(Active.emptySet()); }
        if (act === "rem"){ b.sets.pop(); }
        if (act === "up"){ blocks.splice(bi-1, 0, blocks.splice(bi,1)[0]); }
        if (act === "down"){ blocks.splice(bi+1, 0, blocks.splice(bi,1)[0]); }
        if (act === "skip"){
          const hasData = b.sets.some(s => s.completed || s.weight !== null || s.reps !== null);
          closeSheet();
          if (hasData){
            const ok = await confirmAction({
              title: "¿Quitar " + b.exerciseNameSnapshot + "?",
              message: "Se pierde lo que haya registrado de este ejercicio en el entrenamiento. La rutina no cambia.",
              okText: "Quitar",
              danger: true
            });
            if (!ok) return;
          }
          blocks.splice(bi, 1);
          persistEdits();
          render();
          return;
        }
        persistEdits();
        closeSheet();
        render();
      });
    }
  );
}

/* ---------- Terminar ---------- */

async function tryFinish(){
  const a = Active.get();
  if (!a) return;

  if (!Active.countCompleted()){
    const ok = await confirmAction({
      title: "No has apuntado nada",
      message: "Un entrenamiento sin ninguna serie apuntada no se guarda. ¿Quieres descartarlo?",
      okText: "Descartar",
      danger: true
    });
    if (ok) doDiscard();
    return;
  }

  doFinish();
}

function doFinish(){
  const result = Active.finish();
  if (!result) return;
  stopTicker();
  releaseWake();
  ui.finish = { sessionId: result.session.id };
  ui.screen = "finish";
  render();
}

async function doDiscard(){
  const ok = await confirmAction({
    title: "¿Descartar el entrenamiento?",
    message: "Se pierde todo lo que has registrado hoy. No se puede deshacer.",
    okText: "Descartar",
    danger: true
  });
  if (!ok) return;
  Active.discard();
  stopTicker();
  releaseWake();
  ui.screen = null;
  ui.tab = "train";
  toast("Entrenamiento descartado");
  render();
}

/* ============================================================
   5d. CALENDARIO E HISTORIAL
   ============================================================ */

const MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio",
  "agosto","septiembre","octubre","noviembre","diciembre"];
const DOW = ["L","M","X","J","V","S","D"];

function dayLabel(iso){
  const d = new Date(iso);
  const dias = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  return dias[d.getDay()] + ", " + d.getDate() + " de " + MONTHS[d.getMonth()] + " de " + d.getFullYear();
}
function hourLabel(iso){
  const d = new Date(iso);
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function sessionsOfDay(key){
  return Store.data.sessions
    .filter(s => localDayKey(s.startedAt) === key)
    .sort((a,b) => new Date(a.startedAt) - new Date(b.startedAt));
}

function renderCalendar(){
  const y = ui.month.y, m = ui.month.m;
  const first = new Date(y, m, 1);
  const startDow = (first.getDay() + 6) % 7;          /* la semana empieza en lunes */
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();
  const todayKey = localDayKey(new Date().toISOString());

  const counts = {};
  Store.data.sessions.forEach(s => {
    const k = localDayKey(s.startedAt);
    counts[k] = (counts[k] || 0) + 1;
  });
  const studied = {};
  Store.data.studySessions.forEach(x => { studied[localDayKey(x.startedAt)] = true; });

  /* Resumen del mes: entrenamientos y horas de estudio. */
  const inMonth = iso => { const d = new Date(iso); return d.getFullYear() === y && d.getMonth() === m; };
  const monthWorkouts = Store.data.sessions.filter(s => inMonth(s.startedAt)).length;
  const monthStudy = Store.data.studySessions.filter(x => inMonth(x.startedAt))
    .reduce((n,x) => n + (x.durationSeconds || 0), 0);

  let html = '<div class="cal-nav">' +
    '<button class="prev" data-month="-1" aria-label="Mes anterior">' + ICONS.chevron + '</button>' +
    '<span class="cal-title">' + MONTHS[m].charAt(0).toUpperCase() + MONTHS[m].slice(1) + ' ' + y + '</span>' +
    '<button data-month="1" aria-label="Mes siguiente">' + ICONS.chevron + '</button>' +
  '</div>' +
  '<div class="cal-month">' + monthWorkouts + (monthWorkouts === 1 ? ' entrenamiento' : ' entrenamientos') +
    ' · ' + fmtHM(monthStudy) + ' de estudio</div>';

  html += '<div class="cal-grid">' + DOW.map(d => '<div class="cal-dow">' + d + '</div>').join("");

  for (let i = 0; i < startDow; i++){
    html += '<div class="cal-day out num">' + (prevDays - startDow + i + 1) + '</div>';
  }
  for (let day = 1; day <= daysInMonth; day++){
    const key = y + "-" + String(m+1).padStart(2,"0") + "-" + String(day).padStart(2,"0");
    const n = counts[key] || 0;
    const cls = "cal-day num" + (n ? " has" : "") + (key === todayKey ? " today" : "") +
      (key === ui.selectedDay ? " sel" : "");
    html += '<button class="' + cls + '" data-day="' + key + '">' + day +
      (studied[key] ? '<span class="sbar"></span>' : '') + '</button>';
  }
  const rest = (7 - ((startDow + daysInMonth) % 7)) % 7;
  for (let i = 1; i <= rest; i++) html += '<div class="cal-day out num">' + i + '</div>';
  html += '</div>';

  html += '<div class="cal-key"><span><i></i>Entreno</span><span><i class="bar"></i>Estudio</span></div>';

  /* Debajo del mes, lo del dia elegido. */
  if (!ui.selectedDay){
    html += '<div class="empty" style="margin:34px 32px">Toca un día del calendario para ver lo que hiciste.</div>';
    return html;
  }

  const list = sessionsOfDay(ui.selectedDay);
  const studyList = Study.ofDay(ui.selectedDay);
  const trainSecs = list.reduce((n,x) => n + (x.durationSeconds || 0), 0);
  const studySecs = studyList.reduce((n,x) => n + (x.durationSeconds || 0), 0);

  html += '<div class="cal-legend">' + dayLabel(ui.selectedDay + "T12:00:00") + '</div>';
  html += '<div class="daysum">Entreno: <b>' + fmtHM(trainSecs) + '</b> · Estudio: <b>' + fmtHM(studySecs) + '</b></div>';

  /* Entrenamiento */
  html += '<div class="daysec">Entrenamiento</div>';
  if (!list.length){
    html += '<div class="dayempty">No entrenaste este día.</div>';
  } else {
    html += '<div class="list">' + list.map(s2 => {
      const st = sessionVolume(s2);
      return '<button class="row" data-opensession="' + s2.id + '">' +
        '<span class="row-main">' +
          '<span class="row-title">' + esc(s2.routineNameSnapshot) +
            (s2.notes && s2.notes.trim() ? '<span class="badge">Nota</span>' : '') + '</span>' +
          '<span class="row-sub num">' + hourLabel(s2.startedAt) + ' · ' + fmtDur(s2.durationSeconds) +
            ' · ' + st.sets + (st.sets === 1 ? ' serie' : ' series') + '</span>' +
        '</span>' +
        '<span class="row-chevron">' + ICONS.chevron + '</span>' +
      '</button>';
    }).join("") + '</div>';
  }

  /* Estudio */
  html += '<div class="daysec">Estudio</div>';
  if (!studyList.length){
    html += '<div class="dayempty">No estudiaste este día.</div>';
  } else {
    html += '<div class="list">' + studyList.map(x =>
      '<button class="row" data-study="' + x.id + '">' +
        '<span class="row-main study-card">' +
          '<span class="row-title num">' + hourLabel(x.startedAt) + ' · ' + fmtHM(x.durationSeconds) + '</span>' +
          (x.rating ? '<span class="row-sub">Cundió: ' + RATINGS[x.rating] + '</span>' : '') +
          (x.notes && x.notes.trim() ? '<span class="snote">' + esc(x.notes) + '</span>' : '') +
        '</span>' +
        '<span class="row-chevron">' + ICONS.chevron + '</span>' +
      '</button>').join("") + '</div>';
  }
  html += '<button class="linkbtn" data-studyadd="' + ui.selectedDay + '">+ Añadir sesión de estudio a este día</button>';

  return html;
}

function saveSessionEdit(){
  const s = Store.data.sessions.find(x => x.id === ui.editId);
  const d = ui.editDraft;
  if (!s) return false;

  const exercises = [];
  d.exercises.forEach(b => {
    const time = blockType(b) === "time";
    const sets = b.sets.filter(hasData).map((x,i) => {
      const out = {
        setNumber: i + 1,
        weight: x.weight === undefined ? null : x.weight,
        reps: time ? null : (x.reps === undefined ? null : x.reps),
        rir: (x.rir === null || x.rir === undefined) ? null : x.rir,
        completed: true
      };
      if (time) out.durationSeconds = x.durationSeconds === undefined ? null : x.durationSeconds;
      return out;
    });
    if (sets.length){
      const blk = {
        exerciseId: b.exerciseId,
        exerciseNameSnapshot: b.exerciseNameSnapshot,
        muscleSnapshot: b.muscleSnapshot,
        order: exercises.length,
        sets: sets
      };
      /* Las sesiones de la v1 no llevaban tipo: solo se escribe si ya existia. */
      if (b.trackingTypeSnapshot) blk.trackingTypeSnapshot = b.trackingTypeSnapshot;
      if (b.timeGoalSnapshot) blk.timeGoalSnapshot = b.timeGoalSnapshot;
      exercises.push(blk);
    }
  });

  if (!exercises.length){
    toast("Un entrenamiento sin series no se puede guardar");
    return false;
  }
  const ta = document.getElementById("se-note");
  s.exercises = exercises;
  s.notes = ta ? ta.value.trim() : d.notes;
  Store.save();
  return true;
}

/* ============================================================
   5f. AJUSTES, COPIA DE SEGURIDAD Y MUSCULOS
   ============================================================ */

/* Los datos viven solo en este movil: la copia es la unica red de seguridad. */
function backupStatus(){
  const st = Store.data.settings;
  const total = Store.data.sessions.length;
  if (!st.lastExportAt){
    return {
      warn: total >= 5,
      text: "Nunca has hecho una copia de seguridad. Tienes " + total +
            (total === 1 ? " entrenamiento guardado" : " entrenamientos guardados") +
            " solo en este móvil."
    };
  }
  const since = total - (st.lastExportSessions || 0);
  const days = Math.floor((Date.now() - new Date(st.lastExportAt).getTime()) / 86400000);
  if (since > 10 || days > 30){
    return {
      warn: true,
      text: "Tu última copia es de hace " + days + (days === 1 ? " día" : " días") +
            (since > 0 ? " y desde entonces has entrenado " + since +
              (since === 1 ? " vez" : " veces") : "") + ". Exporta de nuevo."
    };
  }
  return { warn: false, text: "Última copia: " + dayLabel(st.lastExportAt) + "." };
}

function exportData(){
  try {
    const now = new Date();
    const stamp = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0") +
      "-" + String(now.getDate()).padStart(2,"0");
    const blob = new Blob([JSON.stringify(Store.data, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "hrs17-" + stamp + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);

    Store.data.settings.lastExportAt = now.toISOString();
    Store.data.settings.lastExportSessions = Store.data.sessions.length;
    Store.save();
    render();
    toast("Copia exportada");
  } catch(e){
    console.error(e);
    toast("No se ha podido exportar");
  }
}

/* Comprueba que el archivo es de verdad una copia de esta app. */
function validImport(d){
  return d && typeof d === "object" &&
    Array.isArray(d.exercises) && Array.isArray(d.routines) && Array.isArray(d.sessions);
}

function importData(incoming, mode){
  const data = migrate(incoming);
  if (mode === "replace"){
    Store.data = data;
    Store.save();
    return { exercises: data.exercises.length, routines: data.routines.length, sessions: data.sessions.length };
  }
  /* Fusionar: se anade lo que no existe y no se pisa nada de lo que ya hay. */
  const added = { exercises:0, routines:0, sessions:0, studySessions:0 };
  ["exercises","routines","sessions","studySessions"].forEach(key => {
    const have = {};
    Store.data[key].forEach(x => { have[x.id] = true; });
    data[key].forEach(x => {
      if (x && x.id && !have[x.id]){ Store.data[key].push(x); added[key]++; }
    });
  });
  data.muscles.forEach(m => {
    if (!Store.data.muscles.some(x => norm(x) === norm(m))) Store.data.muscles.push(m);
  });
  Store.save();
  return added;
}

   ============================================================ */

function shortDate(iso){
  const d = new Date(iso);
  const y = d.getFullYear() === new Date().getFullYear() ? "" : " " + String(d.getFullYear()).slice(2);
  return d.getDate() + " " + MONTHS[d.getMonth()].slice(0,3) + y;
}

/* Todas las apariciones del ejercicio, agrupadas por sesion. */
function exerciseHistory(exerciseId){
  return Store.data.sessions
    .map(s => {
      const blocks = (s.exercises || [])
        .filter(b => b.exerciseId === exerciseId)
        .sort((a,b) => a.order - b.order);
      const sets = blocks.reduce((acc,b) => acc.concat(completedSets(b)), []);
      return sets.length ? { date:s.startedAt, routine:s.routineNameSnapshot, notes:s.notes, sets:sets,
                             type: blockType(blocks[0]) } : null;
    })
    .filter(Boolean)
    .sort((a,b) => new Date(b.date) - new Date(a.date));
}

/* Una sola linea: el peso de esa serie en cada entrenamiento, del primero
   al ultimo. Sin puntos ni cifras encima: sirve para ver de un vistazo si
   la cosa sube o baja a lo largo de los meses. El detalle esta en el historial. */
/* metric: "weight" (por defecto) o "time". invert: arriba = menos tiempo. */
function buildSetChart(daysAsc, setIndex, metric, invert){
  metric = metric || "weight";
  const isTimeEx = daysAsc.length && daysAsc[0].type === "time";
  const pts = [];
  daysAsc.forEach(d => {
    const set = d.sets[setIndex];
    if (!set) return;
    if (metric === "time"){
      if (set.durationSeconds === null || set.durationSeconds === undefined) return;
      pts.push({ date: d.date, weight: set.durationSeconds });
    } else {
      if (set.weight === null || set.weight === undefined) return;
      if (!isTimeEx && !set.reps) return;
      pts.push({ date: d.date, weight: set.weight });
    }
  });
  if (!pts.length){
    return '<div class="chart-empty">No hay datos de la serie ' + (setIndex + 1) + '.</div>';
  }
  const label = v => metric === "time" ? fmtClock(v) : fmtNum(v) + ' kg';

  const values = pts.map(p => p.weight);
  let min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  if (min === max){ min -= 2.5; max += 2.5; }
  const pad = (max - min) * 0.18;
  min -= pad; max += pad;

  const W = 340, H = 180, L = 48, R = 18, T = 16, B = 26;
  const x = i => pts.length === 1 ? L + (W - L - R) / 2
    : L + (i * (W - L - R)) / (pts.length - 1);
  const y = v => T + (H - T - B) * (invert ? (v - min) / (max - min) : 1 - (v - min) / (max - min));

  let svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';

  const hi = Math.max.apply(null, values), lo = Math.min.apply(null, values);
  [hi, lo].forEach((v,i) => {
    if (i === 1 && hi === lo) return;
    svg += '<line x1="' + L + '" y1="' + y(v).toFixed(1) + '" x2="' + (W-R) + '" y2="' + y(v).toFixed(1) +
      '" stroke="#2A2A2D" stroke-width="1"/>' +
      '<text x="' + (L-8) + '" y="' + (y(v)+4).toFixed(1) + '" text-anchor="end" fill="#8A8A8E" font-size="11">' +
      label(v) + '</text>';
  });

  if (pts.length > 1){
    svg += '<polyline fill="none" stroke="#5AA0FF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="' +
      pts.map((p,i) => x(i).toFixed(1) + "," + y(p.weight).toFixed(1)).join(" ") + '"/>';
  } else {
    svg += '<circle cx="' + x(0).toFixed(1) + '" cy="' + y(pts[0].weight).toFixed(1) + '" r="3.6" fill="#5AA0FF"/>';
  }

  svg += '<text x="' + L + '" y="' + (H-7) + '" fill="#8A8A8E" font-size="11">' + shortDate(pts[0].date) + '</text>';
  if (pts.length > 1){
    svg += '<text x="' + (W-R) + '" y="' + (H-7) + '" text-anchor="end" fill="#8A8A8E" font-size="11">' +
      shortDate(pts[pts.length-1].date) + '</text>';
  }
  svg += '</svg>';
  return svg;
}

function renderExerciseDetail(){
  const ex = Exercises.byId(ui.exerciseId);
  if (!ex){ ui.screen = null; return ""; }
  const history = exerciseHistory(ex.id);

  let html = '<div class="detail">';
  const totalSets = history.reduce((n,d) => n + d.sets.length, 0);
  html += '<div class="dstats">' + esc(ex.muscle) +
    (history.length
      ? ' · ' + history.length + (history.length === 1 ? ' entrenamiento' : ' entrenamientos') +
        ' · ' + totalSets + ' series · desde el ' + shortDate(history[history.length-1].date)
      : ' · sin entrenamientos todavía') +
    (ex.archived ? ' · archivado' : '') + '</div>';

  if (!history.length){
    html += '<div class="empty" style="margin:40px 24px"><strong>Sin datos aún</strong>En cuanto entrenes este ejercicio verás aquí tu progreso.</div></div>';
    return html;
  }

  const daysAsc = history.slice().reverse();
  const maxSets = Math.max.apply(null, history.map(d => d.sets.length));
  const setIndex = Math.min(ui.setIndex || 0, maxSets - 1);

  if (maxSets > 1){
    html += '<div class="chips" style="margin:4px 0 8px">' +
      Array.from({length: maxSets}, (_,i) =>
        '<button class="chip" data-serie="' + i + '" aria-pressed="' + (i === setIndex) + '">Serie ' + (i+1) + '</button>'
      ).join("") + '</div>';
  }
  const isTime = ex.trackingType === "time";
  const metric = isTime ? (ui.metric === "weight" ? "weight" : "time") : "weight";
  const invert = isTime && metric === "time" && ex.timeGoal === "less";
  if (isTime){
    html += '<div class="chips" style="margin:' + (maxSets > 1 ? '0' : '4px') + ' 0 8px">' +
      '<button class="chip" data-metric="time" aria-pressed="' + (metric === "time") + '">Tiempo</button>' +
      '<button class="chip" data-metric="weight" aria-pressed="' + (metric === "weight") + '">Peso</button>' +
    '</div>';
  }
  html += buildSetChart(daysAsc, setIndex, metric, invert);
  html += '<div class="foot-note" style="text-align:left;margin-top:8px">' +
    (metric === "time" ? 'Tiempo' : 'Peso') + ' de la serie ' + (setIndex + 1) +
    ' en cada entrenamiento, del más antiguo al más reciente.' +
    (invert ? ' Eje invertido: cuanto más arriba, menos tiempo, así que subir es mejorar.' : '') + '</div>';

  html += '<div class="sec-label" style="margin:26px 2px 10px">Últimas veces</div>';
  html += history.slice(0, 3).map(hdayHtml).join("");
  if (history.length > 3){
    html += '<button class="linkbtn" data-openhist="exercise">Ver historial completo (' + history.length + ')</button>';
  }

  html += '</div>';
  return html;
}

      '<button class="btn btn-ghost" data-cancel>Seguir estudiando</button>' +
    '</div>',
    sheet => {
      sheet.querySelector("[data-drop]").addEventListener("click", () => {
        closeSheet(); Study.discard(); render(); toast("Sesión descartada");
      });
      sheet.querySelector("[data-keep]").addEventListener("click", () => { closeSheet(); doStudyFinish(); });
      sheet.querySelector("[data-cancel]").addEventListener("click", closeSheet);
    }
  );
}

/* ---------- Anadir o editar a mano ---------- */

function openStudyForm(id, dayKey){
  const x = id ? Study.byId(id) : null;
  const pad = n => String(n).padStart(2,"0");
  const ref = x ? new Date(x.startedAt) : new Date();
  const date = x ? localDayKey(x.startedAt) : (dayKey || localDayKey(new Date().toISOString()));
  const time = pad(ref.getHours()) + ":" + pad(ref.getMinutes());
  const dur = x ? Math.round(x.durationSeconds / 60) : null;
  let rate = x ? x.rating : null;

  openSheet(
    '<h2>' + (x ? 'Editar sesión de estudio' : 'Añadir sesión de estudio') + '</h2>' +
    '<div class="dt-row">' +
      '<div class="field"><label for="st-date">Fecha</label><input class="input" id="st-date" type="date" value="' + date + '"></div>' +
      '<div class="field"><label for="st-time">Empezó a las</label><input class="input" id="st-time" type="time" value="' + time + '"></div>' +
    '</div>' +
    '<div class="field"><label>Duración</label><div class="dur-row">' +
      '<input class="input" id="st-h" type="text" inputmode="numeric" placeholder="0" value="' + (dur === null ? "" : Math.floor(dur / 60)) + '"><span>h</span>' +
      '<input class="input" id="st-m" type="text" inputmode="numeric" placeholder="0" value="' + (dur === null ? "" : dur % 60) + '"><span>min</span>' +
    '</div></div>' +
    '<div class="field"><label for="st-note">Qué estudiaste</label>' +
      '<textarea class="note-area" id="st-note" style="min-height:110px" placeholder="Temario que repasaste, test que hiciste…">' + esc(x ? x.notes || "" : "") + '</textarea></div>' +
    '<div class="field"><label>¿Te cundió?</label>' + ratingSeg(rate) + '</div>' +
    '<div class="error" id="st-error" hidden></div>' +
    '<div class="btn-row">' +
      '<button class="btn btn-primary" id="st-save">' + (x ? 'Guardar cambios' : 'Añadir sesión') + '</button>' +
      '<button class="btn btn-ghost" data-cancel>Cancelar</button>' +
    '</div>',
    sheet => {
      const err = sheet.querySelector("#st-error");
      sheet.querySelector("#rate-seg").addEventListener("click", ev => {
        const b = ev.target.closest("[data-rate]");
        if (!b) return;
        rate = rate === b.dataset.rate ? null : b.dataset.rate;     /* tocar otra vez la quita */
        sheet.querySelectorAll("[data-rate]").forEach(y => y.setAttribute("aria-pressed", y.dataset.rate === rate));
      });
      sheet.querySelector("[data-cancel]").addEventListener("click", closeSheet);
      sheet.querySelector("#st-save").addEventListener("click", () => {
        const dv = sheet.querySelector("#st-date").value;
        const tv = sheet.querySelector("#st-time").value || "00:00";
        const h = parseWhole(sheet.querySelector("#st-h").value) || 0;
        const m = parseWhole(sheet.querySelector("#st-m").value) || 0;
        const secs = (h * 60 + m) * 60;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(dv)){ err.textContent = "Elige la fecha."; err.hidden = false; return; }
        if (secs <= 0){ err.textContent = "Pon cuánto duró."; err.hidden = false; return; }
        if (secs > 24 * 3600){ err.textContent = "Una sesión no puede pasar de 24 horas."; err.hidden = false; return; }
        const [yy, mm, dd] = dv.split("-").map(Number);
        const [hh, mi] = tv.split(":").map(Number);
        const start = new Date(yy, mm - 1, dd, hh, mi, 0, 0);       /* hora local, nunca UTC */
        const saved = Study.save({
          startedAt: start.toISOString(),
          durationSeconds: secs,
          notes: sheet.querySelector("#st-note").value.trim(),
          rating: rate
        }, x ? x.id : null);
        closeSheet();
        render();
        toast(x ? "Sesión actualizada" : "Sesión añadida");
        return saved;
      });
    }
  );
}
